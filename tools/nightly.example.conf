# Template for .local/nightly.conf, read by tools/nightly.sh (docs/NIGHTLY.md,
# "Switching it on"). Copy it there and edit; .local/ is gitignored, so the
# realm id and real paths never reach git. Every line is optional: the value
# shown is the default. Plain shell assignments — quote paths with spaces.

# The QBO realm. Unset: the first [[realms]] id in QBO_CONFIG.
# REALM=0000000000000000
# QBO_CONFIG="$ROOT/.local/config.toml"

# The own book, the live replica the daemon writes, and the company.
# LEDGER_DB="$ROOT/.local/ledger.db"
# REPLICA="$ROOT/.local/replica.db"
# COMPANY=aquamentor

# Replay window: the cutover book (D29) replays from 1 January 2027.
# FROM=2027-01-01

# Reports, outside the repo and outside Dropbox. Keeps the newest KEEP
# nights (nightly-<date>.md/.json and runs/<date>/). The tbdiff files
# `ledger nightly` writes go to TBDIFF_DIR and are never pruned.
# REPORT_DIR="$HOME/Library/Application Support/QuickBooksKILLA/nightly"
# KEEP=90
# TBDIFF_DIR="$REPORT_DIR/tbdiff"
# SNAPSHOT_DIR="$REPORT_DIR/snapshots"
# SNAPSHOT_KEEP=7
# LOG_DIR="$REPORT_DIR/logs"

# The replica is stale when its oldest CDC cursor is older than this. The
# daemon's idle cadence is 5 minutes, so 6 hours is hours of silence.
# MAX_CURSOR_AGE_MIN=360

# Known variances: kind,key,delta,decision,note (docs/NIGHTLY.md).
# EXPLAINED="$ROOT/.local/nightly-explained.csv"

# How a running daemon is recognised (pgrep -f).
# DAEMON_PATTERN="qbo-local daemon"

# Binaries (cargo build --release).
# BIN_DIR="$ROOT/target/release"

# launchd: labels, schedule, and the daemon's own rotating snapshots.
# DAEMON_LABEL=com.aquamentor.qbo-local
# NIGHTLY_LABEL=com.aquamentor.nightly
# HOUR=2
# MINUTE=30
# DAEMON_SNAPSHOT_DIR="$ROOT/.local/snapshots-nightly"
# DAEMON_SNAPSHOT_KEEP=7

# Set NOTIFY=0 to silence the failure notification (tests do).
# NOTIFY=1
