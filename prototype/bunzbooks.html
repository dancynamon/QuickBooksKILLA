<title>BunzBooks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;450;500;600;700&display=swap">

<style>
/* ─── tokens ─────────────────────────────────────────────────────────────
   Light is the base set. Dark redefines the same names twice: once behind
   prefers-color-scheme for viewers on "system", once behind [data-theme]
   so an explicit toggle wins in both directions.                        */
:root {
  --ground:      #EEF3F6;
  --surface:     #FFFFFF;
  --surface-2:   #E4EBF0;
  --surface-3:   #D8E2E9;
  --line:        #CBD8E1;
  --line-soft:   #DFE7ED;
  --ink:         #0B1720;
  --ink-2:       #3D5666;
  --ink-3:       #64798A;
  --ink-dim:     #4E6675;
  --accent:      #C8481F;
  --accent-ink:  #FFFFFF;
  --accent-soft: rgba(200, 72, 31, .10);
  --accent-line: rgba(200, 72, 31, .34);
  --ok:          #197552;
  --ok-soft:     rgba(25, 117, 82, .12);
  --warn:        #9A5D0C;
  --warn-soft:   rgba(154, 93, 12, .13);
  --crit:        #B22F22;
  --crit-soft:   rgba(178, 47, 34, .12);
  --shadow:      0 18px 44px -22px rgba(13, 25, 34, .45);
  --bun-top:     #E39B3A;
  --bun-seed:    #FFF1D6;
  --bun-fill:    #8C4A28;
  --bun-heel:    #D2872B;

  --fs: 1;            /* text scale, driven by the A-/A+ controls */
  --rail: calc(204px * var(--fs));
  --chrome: calc(46px * var(--fs));
  --status: calc(26px * var(--fs));
  --row: calc(30px * var(--fs));

  --sans: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --cond: "IBM Plex Sans Condensed", "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground:      #0A1118;
    --surface:     #0F1A22;
    --surface-2:   #15232D;
    --surface-3:   #1C2E3A;
    --line:        #21353F;
    --line-soft:   #182833;
    --ink:         #E9F1F6;
    --ink-2:       #A8BECB;
    --ink-3:       #7A91A1;
    --ink-dim:     #9CB2C0;
    --accent:      #FF7A45;
    --accent-ink:  #14202B;
    --accent-soft: rgba(255, 122, 69, .13);
    --accent-line: rgba(255, 122, 69, .40);
    --ok:          #3DC694;
    --ok-soft:     rgba(61, 198, 148, .13);
    --warn:        #E3A340;
    --warn-soft:   rgba(227, 163, 64, .13);
    --crit:        #F4695B;
    --crit-soft:   rgba(244, 105, 91, .13);
    --shadow:      0 20px 50px -20px rgba(0, 0, 0, .78);
    --bun-top:     #F0A94A;
    --bun-seed:    #FFF6E4;
    --bun-fill:    #A85A31;
    --bun-heel:    #DE9236;
  }
}

:root[data-theme="dark"] {
  --ground:      #0A1118;
  --surface:     #0F1A22;
  --surface-2:   #15232D;
  --surface-3:   #1C2E3A;
  --line:        #21353F;
  --line-soft:   #182833;
  --ink:         #E9F1F6;
  --ink-2:       #A8BECB;
  --ink-3:       #7A91A1;
  --ink-dim:     #9CB2C0;
  --accent:      #FF7A45;
  --accent-ink:  #14202B;
  --accent-soft: rgba(255, 122, 69, .13);
  --accent-line: rgba(255, 122, 69, .40);
  --ok:          #3DC694;
  --ok-soft:     rgba(61, 198, 148, .13);
  --warn:        #E3A340;
  --warn-soft:   rgba(227, 163, 64, .13);
  --crit:        #F4695B;
  --crit-soft:   rgba(244, 105, 91, .13);
  --shadow:      0 20px 50px -20px rgba(0, 0, 0, .78);
  --bun-top:     #F0A94A;
  --bun-seed:    #FFF6E4;
  --bun-fill:    #A85A31;
  --bun-heel:    #DE9236;
}

/* ─── base ──────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--sans);
  font-size: calc(13.5px * var(--fs));
  font-weight: 450;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: none; padding: 0; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
  border-radius: 2px;
}

.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); }

.lbl {
  font-family: var(--cond);
  font-size: calc(10px * var(--fs));
  font-weight: 600;
  letter-spacing: .10em;
  text-transform: uppercase;
  color: var(--ink-2);
}

kbd {
  font-family: var(--mono);
  font-size: calc(10px * var(--fs));
  padding: 1px 4px;
  border: 1px solid var(--line);
  border-bottom-width: 2px;
  border-radius: 3px;
  background: var(--surface-2);
  color: var(--ink-2);
  white-space: nowrap;
}

/* ─── shell ─────────────────────────────────────────────────────────── */
.app {
  height: 100vh;
  height: 100dvh;
  display: grid;
  grid-template-rows: var(--chrome) 1fr var(--status);
}

/* ─── chrome ────────────────────────────────────────────────────────── */
.chrome {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 12px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  min-width: 0;
}

.mark { display: flex; align-items: center; gap: 8px; padding-right: 12px; border-right: 1px solid var(--line-soft); }
.mark-glyph {
  width: calc(26px * var(--fs)); height: calc(24px * var(--fs));
  flex: none; display: block;
}
.mark-name { font-weight: 600; letter-spacing: -.01em; white-space: nowrap; }
.mark-name span { color: var(--ink-3); font-weight: 450; }

.co {
  display: flex; align-items: center; gap: 7px;
  padding: 4px 9px;
  border: 1px solid var(--line);
  border-radius: 5px;
  background: var(--surface-2);
  white-space: nowrap;
  transition: border-color .12s;
}
.co:hover { border-color: var(--accent-line); }
.co-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
.co-name { font-weight: 500; font-size: calc(12px * var(--fs)); }
.co-realm { font-family: var(--mono); font-size: calc(10px * var(--fs)); color: var(--ink-3); }
.co-caret { color: var(--ink-3); font-size: calc(9px * var(--fs)); }

.omni {
  flex: 1;
  min-width: 90px;
  display: flex; align-items: center; gap: 8px;
  height: calc(27px * var(--fs));
  padding: 0 9px;
  border: 1px solid var(--line);
  border-radius: 5px;
  background: var(--ground);
  color: var(--ink-3);
  text-align: left;
  transition: border-color .12s, background .12s;
}
.omni:hover { border-color: var(--accent-line); background: var(--surface-2); }
.omni-text { flex: 1; font-size: calc(12px * var(--fs)); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.chrome-right { display: flex; align-items: center; gap: 8px; flex: none; }

.pill {
  display: inline-flex; align-items: center; gap: 6px;
  height: calc(24px * var(--fs));
  padding: 0 8px;
  border-radius: 5px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  font-size: calc(11px * var(--fs));
  white-space: nowrap;
}
.pill .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.pill.is-live  { border-color: color-mix(in srgb, var(--ok) 40%, transparent);   background: var(--ok-soft);   color: var(--ok); }
.pill.is-off   { border-color: color-mix(in srgb, var(--warn) 44%, transparent); background: var(--warn-soft); color: var(--warn); }
.pill.is-crit  { border-color: color-mix(in srgb, var(--crit) 44%, transparent); background: var(--crit-soft); color: var(--crit); }
.pill.is-live .dot { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
.pill.is-off  .dot { background: var(--warn); }
.pill.is-crit .dot { background: var(--crit); }

@keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
.pill.is-live .dot { animation: breathe 2.6s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .pill.is-live .dot { animation: none; } }

.icon-btn {
  width: 26px; height: calc(26px * var(--fs));
  display: grid; place-items: center;
  border: 1px solid var(--line);
  border-radius: 5px;
  background: var(--surface-2);
  color: var(--ink-2);
  transition: color .12s, border-color .12s;
}
.icon-btn:hover { color: var(--accent); border-color: var(--accent-line); }

.seg {
  display: inline-flex; flex: none;
  border: 1px solid var(--line);
  border-radius: 5px;
  overflow: hidden;
  background: var(--surface-2);
}
.seg button {
  display: grid; place-items: center;
  min-width: calc(25px * var(--fs));
  height: calc(24px * var(--fs));
  padding: 0 6px;
  color: var(--ink-2);
  font-size: calc(12px * var(--fs));
  line-height: 1;
  border-right: 1px solid var(--line);
  transition: color .12s, background .12s;
}
.seg button:last-child { border-right: none; }
.seg button:hover:not(:disabled) { color: var(--accent); background: var(--accent-soft); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg button:disabled { opacity: .35; cursor: default; }
.seg sup { font-size: .82em; margin-left: 1px; }

/* ─── rail ──────────────────────────────────────────────────────────── */
.body { display: grid; grid-template-columns: var(--rail) 1fr; min-height: 0; }

.rail {
  background: var(--surface);
  border-right: 1px solid var(--line);
  padding: 8px 0;
  overflow-y: auto;
  display: flex; flex-direction: column; gap: 2px;
}
.rail-head { padding: 8px 14px 4px; }
.rail-item {
  display: flex; align-items: center; gap: 9px;
  width: 100%;
  height: calc(27px * var(--fs));
  padding: 0 10px 0 14px;
  color: var(--ink-2);
  font-weight: 450;
  font-size: calc(12.5px * var(--fs));
  border-left: 2px solid transparent;
  text-align: left;
  transition: background .1s, color .1s;
}
.rail-item:hover { background: var(--surface-2); color: var(--ink); }
.rail-item[aria-current="true"] {
  background: var(--accent-soft);
  border-left-color: var(--accent);
  color: var(--ink);
  font-weight: 500;
}
.rail-item .ri-glyph { width: 15px; flex: none; display: grid; place-items: center; color: var(--ink-3); }
.rail-item[aria-current="true"] .ri-glyph { color: var(--accent); }
.rail-item .ri-count {
  margin-left: auto;
  font-family: var(--mono);
  font-size: calc(10.5px * var(--fs));
  color: var(--ink-3);
}
.rail-item .ri-count.alert {
  color: var(--crit);
  background: var(--crit-soft);
  padding: 0 5px;
  border-radius: 8px;
  font-weight: 500;
}

/* ─── main ──────────────────────────────────────────────────────────── */
.main { min-width: 0; overflow: auto; background: var(--ground); }

.view-head {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  padding: 13px 16px 11px;
  background: var(--ground);
  border-bottom: 1px solid var(--line);
}
.view-title { font-size: calc(17px * var(--fs)); font-weight: 600; letter-spacing: -.015em; margin: 0; }
.view-sub { color: var(--ink-3); font-size: calc(12px * var(--fs)); }
.view-head .spacer { flex: 1; }

.btn {
  display: inline-flex; align-items: center; gap: 6px;
  height: calc(26px * var(--fs)); padding: 0 10px;
  border: 1px solid var(--line);
  border-radius: 5px;
  background: var(--surface);
  font-size: calc(12px * var(--fs));
  transition: border-color .12s, color .12s;
}
.btn:hover { border-color: var(--accent-line); color: var(--accent); }
.btn-primary {
  background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 500;
}
.btn-primary:hover { color: var(--accent-ink); filter: brightness(1.07); }

.pad { padding: 14px 16px 28px; }

/* ─── strip: the summary band above every grid ──────────────────────── */
.strip {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(146px, 1fr));
  border: 1px solid var(--line);
  border-radius: 7px;
  overflow: hidden;
  background: var(--surface);
  margin-bottom: 14px;
}
.strip-cell { padding: 9px 12px; border-right: 1px solid var(--line-soft); }
.strip-cell:last-child { border-right: none; }
.strip-val { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: calc(18px * var(--fs)); font-weight: 500; letter-spacing: -.02em; margin-top: 2px; }
.strip-val.pos { color: var(--ok); }
.strip-val.neg { color: var(--crit); }
.strip-val.warn { color: var(--warn); }
.strip-note { font-size: calc(11px * var(--fs)); color: var(--ink-3); margin-top: 1px; }

/* ─── grid ──────────────────────────────────────────────────────────── */
.grid-wrap {
  border: 1px solid var(--line);
  border-radius: 7px;
  overflow: hidden;
  background: var(--surface);
}
.grid-scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: calc(12.5px * var(--fs)); }
thead th {
  position: sticky; top: 0; z-index: 2;
  background: var(--surface-2);
  color: var(--ink-2);
  font-family: var(--cond);
  font-size: calc(10px * var(--fs));
  font-weight: 600;
  letter-spacing: .09em;
  text-transform: uppercase;
  text-align: left;
  padding: 0 10px;
  height: calc(26px * var(--fs));
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
tbody td {
  font-weight: 450;
  height: var(--row);
  padding: 0 10px;
  border-bottom: 1px solid var(--line-soft);
  white-space: nowrap;
  vertical-align: middle;
}
tbody tr:last-child td { border-bottom: none; }
tbody tr { transition: background .08s; }
tbody tr[data-clickable] { cursor: pointer; }
tbody tr[data-clickable]:hover { background: var(--accent-soft); }
.r { text-align: right; }
.dim { color: var(--ink-dim); }
.trunc { max-width: 320px; overflow: hidden; text-overflow: ellipsis; }

.tag {
  display: inline-block;
  padding: 1px 6px;
  border-radius: 3px;
  font-size: calc(10.5px * var(--fs));
  font-family: var(--cond);
  font-weight: 600;
  letter-spacing: .04em;
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--ink-2);
}
.tag.ok   { color: var(--ok);   background: var(--ok-soft);   border-color: color-mix(in srgb, var(--ok) 30%, transparent); }
.tag.warn { color: var(--warn); background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 32%, transparent); }
.tag.crit { color: var(--crit); background: var(--crit-soft); border-color: color-mix(in srgb, var(--crit) 32%, transparent); }
.tag.acc  { color: var(--accent); background: var(--accent-soft); border-color: var(--accent-line); }

.swatch { display: inline-block; width: 7px; height: 7px; border-radius: 2px; margin-right: 6px; vertical-align: baseline; }

/* ─── document chain ────────────────────────────────────────────────── */
.chain {
  display: flex; align-items: stretch; gap: 7px; flex-wrap: wrap;
  padding: 10px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.chain-arrow { align-self: center; color: var(--ink-3); font-size: calc(13px * var(--fs)); }
.chain-step {
  display: flex; flex-direction: column; gap: 1px;
  min-width: calc(112px * var(--fs));
  padding: 6px 11px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--surface-2);
  text-align: left;
  transition: border-color .12s, background .12s;
}
.chain-step:not(:disabled):hover { border-color: var(--accent-line); background: var(--accent-soft); }
.chain-step.is-here { border-color: var(--accent); background: var(--accent-soft); }
.chain-step.is-empty { opacity: .5; border-style: dashed; background: none; }
.chain-lbl {
  font-family: var(--cond); font-size: calc(10px * var(--fs)); font-weight: 600;
  letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3);
}
.chain-no { font-size: calc(13px * var(--fs)); font-weight: 500; }
.chain-step.is-here .chain-no { color: var(--accent); }
.chain-state { font-size: calc(11px * var(--fs)); color: var(--ink-dim); }

/* ─── linked-record rows ────────────────────────────────────────────── */
.link-row {
  display: flex; align-items: center; gap: 9px;
  padding: 8px 0;
  border-bottom: 1px solid var(--line-soft);
  width: 100%; text-align: left;
}
.link-row:last-child { border-bottom: none; }
.link-row:hover .link-main { color: var(--accent); }
.link-glyph {
  width: calc(24px * var(--fs)); height: calc(24px * var(--fs)); flex: none;
  display: grid; place-items: center;
  border-radius: 5px; background: var(--surface-2); border: 1px solid var(--line);
  color: var(--ink-2); font-size: calc(12px * var(--fs));
}
.link-main { flex: 1; min-width: 0; }
.link-main b { font-weight: 500; }
.link-sub { font-size: calc(11px * var(--fs)); color: var(--ink-dim); }

/* ─── palette match reason ──────────────────────────────────────────── */
.pi-why {
  font-family: var(--cond); font-size: calc(10px * var(--fs)); font-weight: 600;
  letter-spacing: .06em; text-transform: uppercase;
  color: var(--accent); background: var(--accent-soft);
  border: 1px solid var(--accent-line); border-radius: 3px;
  padding: 0 5px; flex: none; white-space: nowrap;
}
.pi-why.soft { color: var(--ink-3); background: var(--surface-2); border-color: var(--line); }

/* ─── two-column detail ─────────────────────────────────────────────── */
.split { display: grid; grid-template-columns: minmax(0, 1fr) 268px; gap: 14px; align-items: start; }
@media (max-width: 900px) { .split { grid-template-columns: minmax(0, 1fr); } }

.panel { border: 1px solid var(--line); border-radius: 7px; background: var(--surface); overflow: hidden; }
.panel-head {
  display: flex; align-items: center; gap: 8px;
  height: calc(30px * var(--fs)); padding: 0 12px;
  background: var(--surface-2);
  border-bottom: 1px solid var(--line);
}
.panel-body { padding: 11px 12px; }

.kv { display: grid; grid-template-columns: 88px 1fr; gap: 4px 10px; font-size: calc(12px * var(--fs)); }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; }

/* ─── class margin bars ─────────────────────────────────────────────── */
.bars { display: flex; flex-direction: column; gap: 9px; }
.bar-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: baseline; }
.bar-name { font-size: calc(12px * var(--fs)); }
.bar-fig { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: calc(12px * var(--fs)); }
.bar-track { grid-column: 1 / -1; height: 5px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
.bar-fill { height: 100%; border-radius: 3px; transition: width .5s cubic-bezier(.2,.8,.2,1); }
@media (prefers-reduced-motion: reduce) { .bar-fill { transition: none; } }

/* ─── invoice editor ────────────────────────────────────────────────── */
.doc-head { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 16px; padding: 12px; border-bottom: 1px solid var(--line); }
.field { display: flex; flex-direction: column; gap: 3px; }
.field-val { font-size: calc(13px * var(--fs)); font-weight: 500; }

.line-add { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-top: 1px solid var(--line); background: var(--surface-2); flex-wrap: wrap; }
.line-add input {
  flex: 1; min-width: 120px;
  height: calc(26px * var(--fs)); padding: 0 9px;
  border: 1px solid var(--line);
  border-radius: 5px;
  background: var(--surface);
  font-family: var(--mono);
  font-size: calc(12px * var(--fs));
}
.line-add input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }

.totals { display: flex; justify-content: flex-end; padding: 10px 12px; border-top: 1px solid var(--line); }
.totals dl { display: grid; grid-template-columns: auto 108px; gap: 3px 18px; margin: 0; font-size: calc(12.5px * var(--fs)); }
.totals dt { color: var(--ink-2); text-align: right; }
.totals dd { margin: 0; font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
.totals .grand dt, .totals .grand dd { font-weight: 600; font-size: calc(14px * var(--fs)); padding-top: 5px; border-top: 1px solid var(--line); margin-top: 3px; }

/* ─── failure inbox ─────────────────────────────────────────────────── */
.fail { border: 1px solid var(--line); border-radius: 7px; background: var(--surface); overflow: hidden; margin-bottom: 10px; }
.fail-bar { display: flex; align-items: center; gap: 9px; padding: 9px 12px; border-left: 3px solid var(--crit); }
.fail-bar.warn { border-left-color: var(--warn); }

.diff { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin-top: 9px; font-size: calc(12px * var(--fs)); padding: 8px 10px; background: var(--ground); border-radius: 5px; border: 1px solid var(--line-soft); }
.diff .k { color: var(--ink-3); font-family: var(--cond); font-size: calc(10px * var(--fs)); letter-spacing: .08em; text-transform: uppercase; align-self: center; }

/* ─── status bar ────────────────────────────────────────────────────── */
.statusbar {
  display: flex; align-items: center; gap: 14px;
  padding: 0 12px;
  background: var(--surface);
  border-top: 1px solid var(--line);
  font-size: calc(11px * var(--fs));
  color: var(--ink-3);
  overflow: hidden;
  white-space: nowrap;
}
.statusbar .sb-item { display: flex; align-items: center; gap: 5px; flex: none; }
.statusbar .sb-item b { font-family: var(--mono); font-weight: 500; color: var(--ink-2); }
.statusbar .spacer { flex: 1; }

/* ─── command palette ───────────────────────────────────────────────── */
.scrim {
  position: fixed; inset: 0; z-index: 40;
  background: color-mix(in srgb, var(--ground) 72%, transparent);
  backdrop-filter: blur(3px);
  display: grid; place-items: start center;
  padding-top: 11vh;
}
.scrim[hidden] { display: none; }
.pal {
  width: min(560px, 92vw);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 9px;
  box-shadow: var(--shadow);
  overflow: hidden;
}
.pal-in { display: flex; align-items: center; gap: 9px; padding: 0 13px; height: calc(44px * var(--fs)); border-bottom: 1px solid var(--line); }
.pal-in input { flex: 1; border: none; background: none; height: 100%; font-size: calc(15px * var(--fs)); }
.pal-in input:focus { outline: none; }
.pal-list { max-height: 46vh; overflow-y: auto; padding: 5px; }
.pal-sec { padding: 7px 9px 3px; }
.pal-item {
  display: flex; align-items: center; gap: 10px;
  width: 100%; padding: 6px 9px;
  border-radius: 5px;
  text-align: left;
}
.pal-item[data-active="true"] { background: var(--accent-soft); }
.pal-item .pi-glyph { width: 16px; flex: none; color: var(--ink-3); display: grid; place-items: center; }
.pal-item[data-active="true"] .pi-glyph { color: var(--accent); }
.pal-item .pi-main { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: calc(13px * var(--fs)); }
.pal-item .pi-meta { font-family: var(--mono); font-size: calc(11px * var(--fs)); color: var(--ink-3); flex: none; }
.pal-foot { display: flex; align-items: center; gap: 14px; padding: 7px 13px; border-top: 1px solid var(--line); background: var(--surface-2); font-size: calc(11px * var(--fs)); color: var(--ink-3); flex-wrap: wrap; }
.pal-empty { padding: 22px 13px; text-align: center; color: var(--ink-3); font-size: calc(12.5px * var(--fs)); }

/* ─── toast ─────────────────────────────────────────────────────────── */
.toasts { position: fixed; right: 14px; bottom: 38px; z-index: 50; display: flex; flex-direction: column; gap: 7px; align-items: flex-end; }
.toast {
  display: flex; align-items: center; gap: 9px;
  padding: 8px 12px;
  border: 1px solid var(--line);
  border-left: 3px solid var(--ok);
  border-radius: 6px;
  background: var(--surface);
  box-shadow: var(--shadow);

.toast.warn { border-left-color: var(--warn); }
@keyframes rise { from { opacity: 0; transform: translateY(7px); } }

  /* ─── document lineage ───────────────────────────────────────────────
     QuickBooks models this with LinkedTxn: an invoice knows the estimate it
     came from, a bill knows its purchase order. The chain is what you
     actually want to see — where a document came from and what it became.  */

  const DOC = {
    estimate: { label: "Estimate", glyph: "◈", view: "estimate" },
    invoice:  { label: "Invoice",  glyph: "▤", view: "invoice"  },
    payment:  { label: "Payment",  glyph: "◍", view: "payments" },
    po:       { label: "PO",       glyph: "▥", view: "po"       },
    bill:     { label: "Bill",     glyph: "▧", view: "bills"    },
    billpay:  { label: "Bill pmt", glyph: "◍", view: "bills"    }
  };

  function lineage(kind, no) {
    const chain = [];
    if (kind === "estimate" || kind === "invoice") {
      let est = null, inv = null;
      if (kind === "estimate") {
        est = ESTIMATES.find(e => e.no === no) || null;
        const first = est && est.progress && est.progress.length ? est.progress[0].inv : null;
        inv = first ? INVOICES.find(i => i.no === first) : null;
      } else {
        inv = INVOICES.find(i => i.no === no) || null;
        est = ESTIMATES.find(e => (e.progress || []).some(x => x.inv === no)) || null;
        if (!est && inv && inv.fromEstimate) est = ESTIMATES.find(e => e.no === inv.fromEstimate) || null;
      }

      if (est) chain.push({ kind: "estimate", no: est.no, amount: est.total, state: est.status.toLowerCase() });
      else chain.push({ kind: "estimate", no: null, amount: null, state: "none" });

      if (inv) {
        const staged = est && (est.progress || []).length > 1;
        chain.push(staged
          ? { kind: "invoice", no: est.progress.map(x => x.inv).join(", "),
              amount: estProgress(est).invoiced,
              state: `${est.progress.length} invoices · ${estProgress(est).pct}% billed` }
          : { kind: "invoice", no: inv.no, amount: inv.total, state: inv.status.toLowerCase() });
      }
      else chain.push({ kind: "invoice", no: null, amount: null, state: "none" });

      const pays = inv ? PAYMENTS.filter(pm => pm.inv === inv.no) : [];
      chain.push(pays.length
        ? { kind: "payment", no: pays.map(pm => pm.no).join(", "),
            amount: pays.reduce((a, pm) => a + pm.amount, 0),
            state: inv && inv.bal === 0 ? "paid in full" : "partial" }
        : { kind: "payment", no: null, amount: null, state: "none" });
    } else {
      const po   = POS.find(x => x.no === no) || POS.find(x => x.bill === no);
      const bill = BILLS.find(b => b.no === (po || {}).bill) || BILLS.find(b => b.no === no);
      const bps  = bill ? BILLPAYMENTS.filter(b => b.bill === bill.no) : [];

      chain.push(po ? { kind: "po", no: po.no, amount: po.total, state: poReceipt(po).status.toLowerCase() }
                    : { kind: "po", no: null, amount: null, state: "none" });
      chain.push(bill ? { kind: "bill", no: bill.no, amount: bill.total, state: billStatus(bill).toLowerCase() }
                      : { kind: "bill", no: null, amount: null, state: "none" });
      chain.push(bps.length
        ? { kind: "billpay", no: bps.map(b => b.no).join(", "),
            amount: bps.reduce((a, b) => a + b.amount, 0), state: "paid" }
        : { kind: "billpay", no: null, amount: null, state: "none" });
    }
    return chain;
  }

  /* The chain rail shown on top of every document. */
  function lineageRail(kind, no) {
    const chain = lineage(kind, no);
    return `<div class="chain">${chain.map((step, n) => {
      const meta = DOC[step.kind];
      const here = step.kind === kind && step.no === no;
      const dead = !step.no;
      return `${n ? '<span class="chain-arrow" aria-hidden="true">→</span>' : ""}
        <button class="chain-step${here ? " is-here" : ""}${dead ? " is-empty" : ""}"
                ${dead || here ? "disabled" : ""} data-chain="${step.kind}:${step.no || ""}">
          <span class="chain-lbl">${meta.label}</span>
          <span class="chain-no mono">${dead ? "not yet" : esc(step.no)}</span>
          <span class="chain-state">${dead ? "&nbsp;" : esc(step.state)}${step.amount ? " · " + plain(step.amount) : ""}</span>
        </button>`;
    }).join("")}</div>`;
  }

  /* ─── search index ───────────────────────────────────────────────────
     Typing a number is ambiguous — 3611 is an estimate, 21234 an invoice,
     4471882 a customer's own PO. Rather than guess, index every number
     a record can be known by and say which one matched.                  */

  function searchIndex() {
    const rows = [];
    const key = (v, why, weight) => ({ v: String(v), why, weight });

    INVOICES.forEach(i => rows.push({
      kind: "invoice", no: i.no, glyph: "▤",

        i.custPO && key(i.custPO, "customer PO", 4),
        i.shopify && key(i.shopify.replace("#", ""), "Shopify order", 8),
        i.tracking && key(i.tracking, "tracking number", 12),
        i.fromEstimate && key(i.fromEstimate, "from estimate " + i.fromEstimate, 6),
        i.dropshipPO && key(i.dropshipPO, "dropship " + i.dropshipPO, 7),
        key(plain(i.total).replace(/,/g, ""), "amount", 16),
        i.bal && key(plain(i.bal).replace(/,/g, ""), "balance", 18)
      ].filter(Boolean),
      act: () => go("invoice", i.no)
    }));

    ESTIMATES.forEach(e => rows.push({
      kind: "estimate", no: e.no, glyph: "◈",
      title: `Estimate ${e.no} — ${cust(e.cust).short}`,
      meta: plain(e.total),
      keys: [
        key(e.no, "estimate number", 0),
        e.custPO && key(e.custPO, "customer PO", 4),
        key(plain(e.total).replace(/,/g, ""), "amount", 16)
      ].filter(Boolean),
      act: () => go("estimate", e.no)
    }));

    POS.forEach(o => rows.push({
      kind: "po", no: o.no, glyph: "▥",
      title: `${o.no} — ${o.vendor}`,
      meta: plain(o.total),
      keys: [
        key(o.no, "PO number", 0),
        key(o.no.replace(/\D/g, ""), "PO number", 1),
        key(plain(o.total).replace(/,/g, ""), "amount", 16)
      ],
      act: () => go("po", o.no)
    }));

    VENDORCREDITS.forEach(v => rows.push({
      kind: "credit", no: v.no, glyph: "◐",
      title: `${v.no} — ${v.vendor}`,
      meta: plain(v.total),
      keys: [
        key(v.no, "credit number", 0),
        key(v.no.replace(/\D/g, ""), "credit number", 1),
        key(plain(v.total).replace(/,/g, ""), "credit amount", 16)
      ],
      act: () => go("credits")
    }));

    BILLS.forEach(b => rows.push({
      kind: "bill", no: b.no, glyph: "▧",
      title: `${b.no} — ${b.vendor}`,
      meta: plain(b.total),
      keys: [
        key(b.no, "bill number", 0),
        key(b.no.replace(/\D/g, ""), "bill number", 1),
        b.po && key(b.po.replace(/\D/g, ""), "from PO " + b.po, 6),
        key(plain(b.total).replace(/,/g, ""), "amount", 16)
      ].filter(Boolean),
      act: () => go("bill", b.no)
    }));

    PAYMENTS.forEach(pm => rows.push({
      kind: "payment", no: pm.no, glyph: "◍",
      title: `${pm.no} — ${cust(pm.cust).short}`,
      meta: plain(pm.amount),
      keys: [
        key(pm.no.replace(/\D/g, ""), "payment number", 0),
        key(pm.inv, "applied to invoice " + pm.inv, 3),
        key(plain(pm.amount).replace(/,/g, ""), "amount", 16),
        key(pm.method.replace(/\D/g, "") || "0", "payment reference", 10)
      ],
      act: () => go("payments")
    }));

    CUSTOMERS.forEach(c => rows.push({
      kind: "customer", no: c.id, glyph: "◑",
      title: c.name, meta: c.bal ? plain(c.bal) : "",
      keys: [key(plain(c.bal).replace(/,/g, ""), "open balance", 20)],
      act: () => go("customer", c.id)
    }));

    ITEMS.forEach(i => rows.push({
      kind: "item", no: i.sku, glyph: "▦",
      title: `${i.sku} — ${i.desc}`, meta: plain(i.price),
      keys: [key(plain(i.price).replace(/,/g, ""), "unit price", 20)],
      act: () => go("items")
    }));

    return rows;
  }

  /* Score a record against a typed reference. Exact beats prefix beats
     contains; within each, the more canonical the field the better, so an
     invoice number outranks an amount that happens to contain the digits. */
  function scoreKeys(row, q) {
    let best = null;
    row.keys.forEach(k => {
      const v = k.v.toLowerCase();
      let base = null;
      if (v === q) base = 1000;
      else if (v.startsWith(q)) base = 600;
      else if (v.includes(q)) base = 300;
      if (base === null) return;
      const score = base - k.weight;
      if (!best || score > best.score) best = { score, why: k.why, exact: v === q };
    });
    return best;
  }

  /* ─── state ─────────────────────────────────────────────────────────── */
  const state = { view: "today", arg: null, online: true, pending: 1, syncAge: 4, fs: 1 };

  const $  = s => document.querySelector(s);
  const el = (t, c, h) => { const n = document.createElement(t); if (c) n.className = c; if (h != null) n.innerHTML = h; return n; };
  const esc = s => String(s).replace(/[&<>"]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));

  /* Every navigation reports how long the local read took. The point of the
     product is that this number never depends on the network. */
  function readMs() { return (Math.random() * 7 + 5).toFixed(0); }

  /* `key` makes a toast replace its predecessor instead of stacking — holding
     down A+ should leave one readout behind, not six. */
  const toastTimers = new Map();
  function toast(msg, ms, warn, key) {
    if (key) {
      const prior = $("#toasts").querySelector(`[data-key="${key}"]`);
      if (prior) { clearTimeout(toastTimers.get(key)); prior.remove(); }
    }
    const t = el("div", "toast" + (warn ? " warn" : ""));
    if (key) t.dataset.key = key;
    t.innerHTML = `<span>${esc(msg)}</span>` + (ms ? `<span class="t-ms">${esc(ms)}</span>` : "");
    $("#toasts").appendChild(t);
    const timer = setTimeout(() => {
      t.style.opacity = "0"; t.style.transition = "opacity .3s";
      setTimeout(() => t.remove(), 300);
      if (key) toastTimers.delete(key);
    }, key ? 1600 : 3400);
    if (key) toastTimers.set(key, timer);
  }

        ["31–60",    openInv.filter(i => i.age > 30 && i.age <= 60).reduce((s, i) => s + i.bal, 0)],
        ["61–90",    openInv.filter(i => i.age > 60 && i.age <= 90).reduce((s, i) => s + i.bal, 0)],
        ["90+",      openInv.filter(i => i.age > 90).reduce((s, i) => s + i.bal, 0)]

      // Margin by class — the per-product-line P&L the whole class dimension exists for.
      const margins = CLASSES.map(c => {

    invoice(no) {
      const inv = INVOICES.find(i => i.no === no) || INVOICES[0];
      const c = cust(inv.cust);
      const sub = inv.lines.reduce((s, l) => s + l.qty * l.rate, 0);
      const taxable = c.tax.startsWith("Taxable");
      const tax = taxable ? Math.round(sub * 0.06625) : 0;

      // The journal entry this document produces. Shown because a document is
      // only ever a way of describing its ledger effect.
      const cogs = inv.lines.reduce((s2, l) => {
        const it = item(l.sku);
        return s2 + (it && it.type === "Inventory" ? l.qty * it.cost : 0);
      }, 0);
      const post = [
        ["1200", "Accounts Receivable", sub + tax, 0],
        ["4100", "Sales income — " + cls(inv.cls).name, 0, sub]
      ];
      if (tax) post.push(["2200", "Sales tax payable — NJ", 0, tax]);
      if (cogs) { post.push(["5000", "Cost of goods sold", cogs, 0]);
                  post.push(["1300", "Inventory asset", 0, cogs]); }
      const dr = post.reduce((s2, r) => s2 + r[2], 0);
      const cr = post.reduce((s2, r) => s2 + r[3], 0);

      return head("Invoice " + inv.no, `${esc(c.short)} · ${inv.date}`,
        `<button class="btn" data-go="invoices">← Back</button>
         <button class="btn">Print</button>
         <button class="btn btn-primary" data-save="${inv.no}">Save <kbd style="border-color:currentColor;background:transparent;color:inherit">⌘S</kbd></button>`)
        + lineageRail("invoice", inv.no) + `
      <div class="pad">
        <div class="split">
          <div>
          <div class="panel">
            <div class="doc-head">
              <div class="field"><span class="lbl">Customer</span><span class="field-val">${esc(c.short)}</span></div>
              <div class="field"><span class="lbl">Terms</span><span class="field-val">${esc(c.terms)}</span></div>
              <div class="field"><span class="lbl">Date</span><span class="field-val mono">${inv.date}</span></div>
              <div class="field"><span class="lbl">Class</span><span class="field-val"><span class="swatch" style="background:${cls(inv.cls).color}"></span>${cls(inv.cls).name}</span></div>
              <div class="field"><span class="lbl">Tax treatment</span><span class="field-val" style="font-size:calc(12px * var(--fs))">${esc(c.tax)}</span></div>
              <div class="field"><span class="lbl">Customer PO</span><span class="field-val mono">${inv.custPO ? esc(inv.custPO) : '<span class="dim">—</span>'}</span></div>
              <div class="field"><span class="lbl">Sync state</span><span class="field-val">${syncTag(inv.sync)}</span></div>
            </div>

            <div class="grid-scroll"><table>
              <thead><tr><th style="width:34px">#</th><th>Item</th><th>Description</th><th class="r">Qty</th><th class="r">Rate</th><th class="r">Amount</th><th>Class</th></tr></thead>
              <tbody id="lineBody">${inv.lines.map((l, n) => lineRow(l, n, inv.cls)).join("")}</tbody>
            </table></div>

            <div class="line-add">
              <span class="lbl" style="flex:none">Add line</span>
              <input id="skuIn" placeholder="Type a SKU — XRT, PM, SIGN…" autocomplete="off" spellcheck="false">
              <span class="dim" style="font-size:calc(11px * var(--fs))">resolves locally, no network</span>
              <kbd>↵</kbd>
            </div>

            <div class="totals">
              <dl>
                <dt>Subtotal</dt><dd id="tSub">${plain(sub)}</dd>
                <dt>Sales tax ${taxable ? "(NJ 6.625%)" : "(exempt)"}</dt><dd id="tTax">${plain(tax)}</dd>
                <div class="grand" style="display:contents"><dt>Total</dt><dd id="tTot">${plain(sub + tax)}</dd></div>
              </dl>
            </div>
          </div>

          <div class="panel" style="margin-top:14px">
            <div class="panel-head"><span class="lbl">What this posts to the ledger</span>
              <span class="spacer" style="flex:1"></span>
              <span class="tag ${dr === cr ? "ok" : "crit"}">${dr === cr ? "balanced" : "out of balance"}</span></div>
            <div class="grid-scroll"><table>
              <thead><tr><th style="width:56px">Acct</th><th>Account</th><th class="r">Debit</th><th class="r">Credit</th></tr></thead>
              <tbody>${post.map(([no, name, d, cx]) => `
                <tr>
                  <td class="mono dim">${no}</td>
                  <td>${esc(name)}</td>
                  <td class="r num">${d ? plain(d) : '<span class="dim">—</span>'}</td>
                  <td class="r num">${cx ? plain(cx) : '<span class="dim">—</span>'}</td>
                </tr>`).join("")}
                <tr style="border-top:1px solid var(--line)">
                  <td></td><td class="lbl">Totals</td>
                  <td class="r num" style="font-weight:600">${plain(dr)}</td>
                  <td class="r num" style="font-weight:600">${plain(cr)}</td>
                </tr>
              </tbody>
            </table></div>
          </div>
          </div>

          <div>
            <div class="panel" style="margin-bottom:14px">
              <div class="panel-head"><span class="lbl">${esc(c.short)}</span></div>
              <div class="panel-body">
                <dl class="kv">

                  <dt>Terms</dt><dd>${esc(c.terms)}</dd>

      </div>`;

    items() {

      <div class="pad">
        <div class="grid-wrap"><div class="grid-scroll"><table>
          <thead><tr><th>SKU</th><th>Description</th><th>Type</th><th>Class</th><th class="r">Price</th><th class="r">Cost</th><th class="r">Margin</th><th class="r">On hand</th></tr></thead>

              <td>${rc.status === "Received" ? '<span class="tag ok">received</span>' : rc.status === "Partial" ? '<span class="tag warn">partial</span>' : '<span class="tag">open</span>'}</td>
              <td>${p.bill ? `<span class="tag acc">${p.bill}</span>` : '<span class="dim">—</span>'}</td>
            </tr>`; }).join("")}</tbody>
        </table></div></div>
      </div>`;

    estimates() {

        `<button class="btn btn-primary">New estimate</button>`) + `
      <div class="pad">
        <div class="strip">
          <div class="strip-cell"><div class="lbl">Open estimates</div><div class="strip-val">${money(open.reduce((a, e) => a + e.total, 0))}</div><div class="strip-note">${open.length} awaiting a decision</div></div>

           <button class="btn btn-primary" data-progress="${e.no}:rest">Invoice remaining ${plain(pr.remaining)}</button>`

      return head("Estimate " + e.no, `${esc(c.short)} · expires ${e.expires}`,
        `<button class="btn" data-go="estimates">← Back</button>${actions}`)
        + lineageRail("estimate", e.no) + `
      <div class="pad">
        <div class="split">
          <div class="panel">

            </div>
            ${e.lines ? `<div class="grid-scroll"><table>
              <thead><tr><th style="width:34px">#</th><th>Item</th><th>Description</th><th class="r">Qty</th><th class="r">Rate</th><th class="r">Amount</th></tr></thead>
              <tbody>${e.lines.map((l, n) => {
                const it = item(l.sku);
                return `<tr><td class="mono dim">${n + 1}</td><td class="mono">${esc(l.sku)}</td>
                  <td class="trunc dim">${esc(it ? it.desc : "")}</td>
                  <td class="r num">${l.qty}</td><td class="r num">${plain(l.rate)}</td>
                  <td class="r num">${plain(l.qty * l.rate)}</td></tr>`; }).join("")}</tbody>
            </table></div>` : ""}
            <div class="totals"><dl>
              <div class="grand" style="display:contents"><dt>Total</dt><dd>${plain(e.total)}</dd></div>
            </dl></div>

                ${pr.count ? `<div style="margin-top:9px">${(e.progress || []).map(x => `

                    <span class="dim" aria-hidden="true">›</span>
                  </button>`).join("")}</div>` : `<p class="hint" style="margin-top:9px">Nothing billed against this estimate yet.</p>`}
              </div>
            </div>
            <div class="panel">
              <div class="panel-head"><span class="lbl">${esc(c.short)}</span></div>
              <div class="panel-body">

                  <dt>Location</dt><dd>${esc(c.city)}</dd>

    po(no) {

      const margin = inv ? Math.round((inv.total - o.total) / inv.total * 100) : null;
      const rc = poReceipt(o);
      return head(o.no, `${esc(o.vendor)} · ${o.date}`,
        `<button class="btn" data-go="pos">← Back</button>
         ${rc.received < rc.ordered ? `<button class="btn btn-primary" data-receive="${o.no}">Receive items</button>` : ""}
         ${bill ? `<button class="btn">Open bill ${bill.no}</button>` : `<button class="btn">Convert to bill</button>`}`)
        + lineageRail("po", o.no) + `
      <div class="pad">
        <div class="split">
          <div class="panel">
            <div class="doc-head">

              <div class="field"><span class="lbl">Ordered value</span><span class="field-val num">${plain(o.total)}</span></div>
              <div class="field"><span class="lbl">Status</span><span class="field-val">${rc.status}${rc.status === "Partial" ? ` · ${plain(rc.value)} received` : ""}</span></div>
            </div>

            <div class="panel-head" style="border-top:1px solid var(--line)"><span class="lbl">Lines — ordered against received</span>
              <span class="spacer" style="flex:1"></span>
              <span class="tag ${rc.status === "Received" ? "ok" : rc.status === "Partial" ? "warn" : ""}">${rc.status.toLowerCase()}</span></div>
            <div class="grid-scroll"><table>
              <thead><tr><th>Item</th><th>Description</th><th class="r">Ordered</th><th class="r">Received</th><th class="r">Remaining</th><th style="width:110px"></th></tr></thead>
              <tbody>${o.lines.map(l => `
                <tr>
                  <td class="mono">${esc(l.sku)}</td>

            </table></div>

            ${o.receipts.length ? `
            <div class="panel-head" style="border-top:1px solid var(--line)"><span class="lbl">Receipt history</span></div>
            <div class="panel-body" style="padding:2px 12px 10px">
              ${o.receipts.map(r => `
                <div class="link-row" style="cursor:default">

            ${inv ? `
            <div class="panel-head" style="border-top:1px solid var(--line)"><span class="lbl">Dropship — fulfils a customer order</span></div>
            <div class="grid-scroll"><table>
              <thead><tr><th>Customer invoice</th><th>Customer</th><th class="r">You charged</th><th class="r">Vendor cost</th><th class="r">Gross margin</th></tr></thead>
              <tbody><tr data-clickable data-inv="${inv.no}">

                <td class="trunc">${esc(cust(inv.cust).short)}</td>
                <td class="r num">${plain(inv.total)}</td>
                <td class="r num dim">${plain(o.total)}</td>
                <td class="r num" style="color:${margin > 30 ? "var(--ok)" : margin > 0 ? "var(--warn)" : "var(--crit)"}">${plain(inv.total - o.total)} · ${margin}%</td>

            </table></div>` : ""}
          </div>
          <div class="panel">
            <div class="panel-head"><span class="lbl">Linked records</span></div>
            <div class="panel-body" style="padding:2px 12px 10px">
              ${linkRows([
                bill ? { glyph: "▧", main: `${bill.no} — ${plain(bill.total)}`, sub: `Vendor bill · due ${bill.due} · ${billStatus(bill).toLowerCase()}`, act: () => go("bill", bill.no) }
                     : { glyph: "▧", main: "No bill yet", sub: "This PO has not been billed", dead: true },
                inv ? { glyph: "▤", main: `Invoice ${inv.no}`, sub: `Dropship to ${cust(inv.cust).short}`, act: () => go("invoice", inv.no) }

    bills() {
      const openCredit = VENDORCREDITS.reduce((a, v) => a + vcRemaining(v), 0);

      <div class="pad">
        ${openCredit ? `<div class="strip" style="margin-bottom:14px">

        <div class="grid-wrap"><div class="grid-scroll"><table>
          <thead><tr><th>No.</th><th>Date</th><th>Vendor</th><th>From PO</th><th class="r">Total</th><th class="r">Credits</th><th class="r">Paid</th><th class="r">Balance</th><th>Due</th><th>Status</th></tr></thead>

    bill(no) {

      const credits = billCredits(b);
      const pays = BILLPAYMENTS.filter(x => x.bill === b.no);
      const bal = billBalance(b);

      return head(b.no, `${esc(b.vendor)} · due ${b.due}`,
        `<button class="btn" data-go="bills">← Back</button>
         ${available.length && bal > 0 ? `<button class="btn btn-primary" data-applyvc="${available[0].no}:${b.no}">Apply ${plain(Math.min(vcRemaining(available[0]), bal))} credit</button>` : ""}
         ${bal > 0 ? `<button class="btn">Pay bill</button>` : `<span class="tag ok" style="align-self:center">settled</span>`}`)
        + lineageRail("bill", b.no) + `
      <div class="pad">
        <div class="split">
          <div class="panel">
            <div class="doc-head">
              <div class="field"><span class="lbl">Vendor</span><span class="field-val">${esc(b.vendor)}</span></div>
              <div class="field"><span class="lbl">Bill date</span><span class="field-val mono">${b.date}</span></div>
              <div class="field"><span class="lbl">Due</span><span class="field-val mono">${b.due}</span></div>

                  <td>Credit applied <span class="tag acc">${c.vc}</span></td>
                  <td class="r num" style="color:var(--ok)">−${plain(c.amount)}</td>

                ${pays.map(x => `<tr>
                  <td>Payment ${x.no}</td>
                  <td class="r num dim">−${plain(x.amount)}</td>
                  <td class="dim">${x.date} · ${esc(x.method)}</td></tr>`).join("")}
                <tr style="border-top:1px solid var(--line)">
                  <td style="font-weight:600">Balance due</td>
                  <td class="r num" style="font-weight:600;color:${bal > 0 ? "var(--warn)" : "var(--ok)"}">${plain(bal)}</td>
                  <td class="dim">${bal > 0 ? "still owed" : "settled"}</td></tr>
              </tbody>
            </table></div>
          </div>
          <div>
            <div class="panel" style="margin-bottom:14px">
              <div class="panel-head"><span class="lbl">Credit available from ${esc(b.vendor)}</span></div>
              <div class="panel-body" style="padding:2px 12px 10px">
                ${available.length ? available.map(v => `
                  <button class="link-row" data-vc="${v.no}">
                    <span class="link-glyph" aria-hidden="true">◐</span>
                    <span class="link-main"><b>${v.no} — ${plain(vcRemaining(v))} unapplied</b>
                      <div class="link-sub">${esc(v.reason)}</div></span>
                    <span class="dim" aria-hidden="true">›</span>

                : `<p class="hint" style="margin:8px 0">No unapplied credit from this vendor.</p>`}
              </div>
            </div>
            <div class="panel">
              <div class="panel-head"><span class="lbl">Linked records</span></div>
              <div class="panel-body" style="padding:2px 12px 10px">
                ${linkRows([ b.po
                  ? { glyph: "▥", main: b.po, sub: "Purchase order this bill came from" }
                  : { glyph: "▥", main: "No purchase order", sub: "Entered directly", dead: true } ])}
              </div>
            </div>
          </div>
        </div>
      </div>`;
    },

    credits() {
      const unapplied = VENDORCREDITS.reduce((a, v) => a + vcRemaining(v), 0);
      return head("Vendor credits", `${VENDORCREDITS.length} on file · ${money(unapplied)} not yet applied`) + `
      <div class="pad">
        <div class="strip">
          <div class="strip-cell"><div class="lbl">Issued</div><div class="strip-val">${money(VENDORCREDITS.reduce((a, v) => a + v.total, 0))}</div><div class="strip-note">total credited by vendors</div></div>
          <div class="strip-cell"><div class="lbl">Applied</div><div class="strip-val">${money(VENDORCREDITS.reduce((a, v) => a + vcApplied(v), 0))}</div><div class="strip-note">taken against bills</div></div>
          <div class="strip-cell"><div class="lbl">Unapplied</div><div class="strip-val pos">${money(unapplied)}</div><div class="strip-note">money back still on the table</div></div>
        </div>
        <div class="grid-wrap"><div class="grid-scroll"><table>
          <thead><tr><th>No.</th><th>Date</th><th>Vendor</th><th>Reason</th><th class="r">Amount</th><th class="r">Applied</th><th class="r">Available</th><th>Against</th></tr></thead>
          <tbody>${VENDORCREDITS.map(v => `
            <tr data-clickable ${v.applied.length ? `data-bill="${v.applied[0].bill}"` : ""}>
              <td class="mono">${v.no}</td>
              <td class="mono dim">${v.date}</td>
              <td>${esc(v.vendor)}</td>
              <td class="trunc dim">${esc(v.reason)}</td>
              <td class="r num">${plain(v.total)}</td>
              <td class="r num dim">${vcApplied(v) ? plain(vcApplied(v)) : "—"}</td>
              <td class="r num" style="color:${vcRemaining(v) ? "var(--ok)" : "var(--ink-dim)"}">${vcRemaining(v) ? plain(vcRemaining(v)) : "—"}</td>
              <td>${v.applied.length ? v.applied.map(a => `<span class="tag acc">${a.bill}</span>`).join(" ") : '<span class="tag warn">unapplied</span>'}</td>
            </tr>`).join("")}</tbody>
        </table></div></div>
        <p class="hint">An unapplied credit is money a vendor already agreed you are owed. It only reduces what you pay once it is applied to a bill.</p>

    payments() {
      return head("Payments received", `${PAYMENTS.length} applied to invoices`) + `
      <div class="pad">
        <div class="grid-wrap"><div class="grid-scroll"><table>
          <thead><tr><th>No.</th><th>Date</th><th>Customer</th><th>Applied to</th><th class="r">Amount</th><th>Method</th></tr></thead>
          <tbody>${PAYMENTS.map(pm => `
            <tr data-clickable data-inv="${pm.inv}">
              <td class="mono">${pm.no}</td>
              <td class="mono dim">${pm.date}</td>
              <td class="trunc">${esc(cust(pm.cust).short)}</td>
              <td><span class="tag acc">inv ${pm.inv}</span></td>
              <td class="r num">${plain(pm.amount)}</td>

    failures() {
      return head("Needs you", "Writes QuickBooks would not take. Nothing was dropped and nothing was merged behind your back.") + `
      <div class="pad">
        ${FAILURES.map((f, n) => `
          <div class="fail">
            <div class="fail-bar ${f.sev === "warn" ? "warn" : ""}">
              <span class="tag ${f.sev}">${f.sev === "crit" ? "conflict" : "rejected"}</span>
              <b>${esc(f.doc)}</b>
              <span class="dim">${esc(f.who)}</span>
              <span class="spacer" style="flex:1"></span>
              <span class="lbl">${esc(f.kind)}</span>
            </div>
            <div class="fail-body">
              <p class="fail-why" style="margin:0">${esc(f.why)}</p>
              <div class="diff">${f.diff.map(([k, v]) => `<span class="k">${esc(k)}</span><span>${esc(v)}</span>`).join("")}</div>
              <div class="fail-acts">
                <button class="btn btn-primary" data-resolve="${n}">Keep my version</button>
                <button class="btn" data-resolve="${n}">Keep the QuickBooks version</button>
                <button class="btn">Open both side by side</button>
              </div>
            </div>
          </div>`).join("")}
        ${FAILURES.length === 0 ? '<div class="panel"><div class="panel-body" style="text-align:center;padding:34px"><div class="strip-val pos" style="font-size:calc(22px * var(--fs))">All clear</div><p class="dim" style="margin:6px 0 0">Every queued write reached QuickBooks.</p></div></div>' : ""}
        <p class="hint">A conflict means someone edited the same record in the QuickBooks web app. BunzBooks never picks a winner for you — a silent overwrite is how a real edit disappears without anyone noticing.</p>
      </div>`;
    }
  };

  /* Records attached to an invoice that are not part of its lineage:
     the vendor PO fulfilling it, the Shopify order it came from, the
     parcel carrying it. */
  function invLinks(inv) {
    const out = [];
    if (inv.dropshipPO) {
      const po = POS.find(o => o.no === inv.dropshipPO);
      if (po) out.push({
        glyph: "▥", main: `${po.no} — ${po.vendor}`,
        sub: `Dropship · vendor cost ${plain(po.total)} · margin ${Math.round((inv.total - po.total) / inv.total * 100)}%`,
        act: () => go("po", po.no)
      });
    }
    if (inv.shopify) out.push({
      glyph: "◎", main: `Shopify order ${inv.shopify}`,
      sub: "harborworks.myshopify.com · opens in Shopify admin", ext: true
    });
    if (inv.tracking) out.push({
      glyph: "◈", main: inv.tracking, sub: "UPS Ground · opens tracking", ext: true
    });
    if (!out.length) out.push({ glyph: "—", main: "Nothing linked", sub: "No dropship PO, Shopify order or parcel", dead: true });
    return out;
  }

  function linkRows(links) {
    return links.map((l, n) => `
      <button class="link-row" ${l.dead ? "disabled" : ""} data-link="${n}">
        <span class="link-glyph" aria-hidden="true">${l.glyph}</span>
        <span class="link-main"><b>${esc(l.main)}</b><div class="link-sub">${esc(l.sub)}</div></span>
        ${l.ext ? '<span class="dim" aria-hidden="true">↗</span>' : l.dead ? "" : '<span class="dim" aria-hidden="true">›</span>'}
      </button>`).join("");
  }

  function lineRow(l, n, invCls) {
    const it = item(l.sku);
    const c = it && it.cls ? cls(it.cls) : cls(invCls);
    return `<tr>
      <td class="mono dim">${n + 1}</td>
      <td class="mono">${esc(l.sku)}</td>
      <td class="trunc dim">${esc(it ? it.desc : "")}</td>
      <td class="r num">${l.qty}</td>
      <td class="r num">${plain(l.rate)}</td>
      <td class="r num">${plain(l.qty * l.rate)}</td>
      <td>${c ? `<span class="swatch" style="background:${c.color}"></span><span class="dim">${c.name}</span>` : ""}</td>
    </tr>`;
  }

  /* ─── routing ───────────────────────────────────────────────────────── */
  function go(view, arg) {
    state.view = view; state.arg = arg;
    const ms = readMs();
    $("#main").innerHTML = (VIEWS[view] || VIEWS.today)(arg);
    $("#main").scrollTop = 0;
    $("#sbMs").textContent = ms + " ms";
    renderRail();
    wireView();
  }

  function wireView() {
    document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
    document.querySelectorAll("[data-inv]").forEach(r => r.onclick = () => go("invoice", r.dataset.inv));
    document.querySelectorAll("[data-cust]").forEach(r => r.onclick = e => { e.stopPropagation(); go("customer", r.dataset.cust); });
    document.querySelectorAll("[data-item]").forEach(r => r.onclick = () => toast("Item detail — not in this prototype"));
    document.querySelectorAll("[data-est]").forEach(r => r.onclick = () => go("estimate", r.dataset.est));
    document.querySelectorAll("[data-po]").forEach(r => r.onclick = e => { e.stopPropagation(); go("po", r.dataset.po); });

    document.querySelectorAll("[data-chain]").forEach(b => b.onclick = () => {
      const [kind, no] = b.dataset.chain.split(":");
      if (!no) return;
      const target = { estimate: "estimate", invoice: "invoice", po: "po", bill: "bill" }[kind];
      if (target) go(target, no.split(",")[0].trim());
      else go(DOC[kind].view);
    });

    document.querySelectorAll("[data-progress]").forEach(b => b.onclick = () => {
      const [no, mode] = b.dataset.progress.split(":");
      progressInvoice(no, mode);
    });
    document.querySelectorAll("[data-receive]").forEach(b => b.onclick = () => receivePO(b.dataset.receive));
    document.querySelectorAll("[data-bill]").forEach(r => r.onclick = e => { e.stopPropagation(); go("bill", r.dataset.bill); });
    document.querySelectorAll("[data-vc]").forEach(r => r.onclick = () => go("credits"));
    document.querySelectorAll("[data-applyvc]").forEach(b => b.onclick = () => {
      const [vc, bill] = b.dataset.applyvc.split(":");
      applyCredit(vc, bill);
    });

    const links = document.querySelectorAll("[data-link]");
    if (links.length && state.view === "invoice") {
      const inv = INVOICES.find(i => i.no === state.arg);
      const model = invLinks(inv);
      links.forEach(b => {
        const l = model[Number(b.dataset.link)];
        b.onclick = () => l.act ? l.act() : toast(l.ext ? "Opens outside this app" : "Nothing to open");
      });
    } else if (links.length && state.view === "po") {
      const o = POS.find(x => x.no === state.arg);
      const bill = BILLS.find(b => b.no === o.bill);
      const inv = o.forInvoice ? INVOICES.find(i => i.no === o.forInvoice) : null;
      links.forEach(b => {
        const n = Number(b.dataset.link);
        b.onclick = () => { if (n === 0 && bill) go("bills"); else if (n === 1 && inv) go("invoice", inv.no); };
      });
    }
    document.querySelectorAll("[data-new]").forEach(b => b.onclick = () => toast("New invoice — open 21234 to see the editor"));

    const save = document.querySelector("[data-save]");
    if (save) save.onclick = () => commitLocally(save.dataset.save);

    document.querySelectorAll("[data-resolve]").forEach(b => b.onclick = () => {
      FAILURES.splice(Number(b.dataset.resolve), 1);
      toast("Resolved — re-queued for QuickBooks");
      updateChrome(); go("failures");
    });

    const sku = $("#skuIn");
    if (sku) sku.onkeydown = e => {
      if (e.key !== "Enter") return;
      const q = sku.value.trim().toUpperCase();
      if (!q) return;
      const hit = ITEMS.find(i => i.sku.toUpperCase().startsWith(q))
               || ITEMS.find(i => i.desc.toUpperCase().includes(q));
      if (!hit) { toast(`No item matches "${sku.value}"`, null, true); return; }
      const inv = INVOICES.find(i => i.no === state.arg);
      inv.lines.push({ sku: hit.sku, qty: 1, rate: hit.price });
      inv.sync = "pending";
      sku.value = "";
      go("invoice", inv.no);
      setTimeout(() => { const s = $("#skuIn"); if (s) s.focus(); }, 0);
      toast(`Added ${hit.sku}`, readMs() + " ms");
    };
  }

  /* Progress invoicing. QuickBooks lets one estimate be billed across several
     invoices — a deposit, a stage payment, the balance — each linked back to
     the estimate. What matters is that the estimate stays the contract and
     never gets consumed by the first invoice. */
  function progressInvoice(no, mode) {
    const e = ESTIMATES.find(x => x.no === no);
    if (!e) return;
    const pr = estProgress(e);
    if (pr.remaining <= 0) return;

    const amount = mode === "50" ? Math.min(Math.round(e.total * 0.5), pr.remaining) : pr.remaining;
    const pct = Math.round(amount / e.total * 100);
    const next = String(Math.max(...INVOICES.map(i => Number(i.no))) + 1);

    INVOICES.unshift({
      no: next, date: "2026-08-20", cust: e.cust, cls: e.cls,
      total: amount, bal: amount, age: 0, status: "Open", sync: "pending",
      custPO: e.custPO, fromEstimate: e.no,
      lines: (e.lines || []).map(l => ({ ...l, rate: Math.round(l.rate * amount / e.total) }))
    });
    e.progress = (e.progress || []).concat([{
      inv: next, pct, amount, date: "2026-08-20",
      note: mode === "50" ? "50% deposit" : "Balance"
    }]);
    e.status = "Accepted";
    state.pending++;
    updateChrome();
    const after = estProgress(e);
    toast(`Invoice ${next} for ${plain(amount)} — estimate ${no} now ${after.pct}% billed`, readMs() + " ms");
    go("invoice", next);
  }

  /* Applying a vendor credit reduces what you owe on a specific bill. It is
     never applied automatically: which bill a credit lands on is an accounting
     decision, and quietly picking one changes what you pay this month. */
  function applyCredit(vcNo, billNo) {
    const v = VENDORCREDITS.find(x => x.no === vcNo);
    const b = BILLS.find(x => x.no === billNo);
    if (!v || !b) return;
    const amount = Math.min(vcRemaining(v), billBalance(b));
    if (amount <= 0) return;

    v.applied = (v.applied || []).concat([{ bill: b.no, amount, date: "2026-08-20" }]);
    state.pending++;
    updateChrome();
    toast(`${vcNo} applied — ${b.no} now ${plain(billBalance(b))} due`, readMs() + " ms");
    go("bill", b.no);
  }

  /* Partial receipt. Goods arrive in more than one delivery, and the PO has to
     carry ordered-against-received per line rather than a single done flag —
     otherwise a backordered colour looks identical to a complete order. */
  function receivePO(no) {
    const o = POS.find(x => x.no === no);
    if (!o) return;
    const line = o.lines.find(l => l.recd < l.qty);
    if (!line) return;

    const qty = line.qty - line.recd;
    line.recd = line.qty;
    const rc = poReceipt(o);
    o.receipts = o.receipts.concat([{
      date: "2026-08-20",
      ref: `RCV-${o.no.replace(/\D/g, "")}-${o.receipts.length + 1}`,
      note: `${qty} × ${line.sku}${rc.status === "Partial" ? " — remainder still outstanding" : " — order complete"}`
    }]);
    state.pending++;
    updateChrome();
    toast(`Received ${qty} × ${line.sku} · ${rc.received} of ${rc.ordered}`, readMs() + " ms");
    go("po", no);
  }

  /* The demo's whole argument: a save commits to local disk and returns
     immediately, online or not. The network catches up afterwards. */
  function commitLocally(no) {
    const inv = INVOICES.find(i => i.no === no);
    if (inv) inv.sync = "pending";
    state.pending++;
    updateChrome();
    const ms = (Math.random() * 14 + 6).toFixed(0);
    toast(state.online ? "Saved to local disk" : "Saved to local disk — will sync when you reconnect", ms + " ms", !state.online);
    go("invoice", no);
    if (state.online) setTimeout(drain, 2200);
  }

  function drain() {
    if (!state.online || state.pending === 0) return;
    state.pending = 0;
    INVOICES.forEach(i => { if (i.sync === "pending") i.sync = "synced"; });
    state.syncAge = 0;
    updateChrome();
    toast("Queue drained to QuickBooks");
    if (["invoice", "invoices", "today"].includes(state.view)) go(state.view, state.arg);
  }

  /* ─── chrome ────────────────────────────────────────────────────────── */
  function updateChrome() {
    const pill = $("#syncPill"), text = $("#syncText");
    if (state.online) {
      pill.className = "pill is-live";
      text.textContent = state.syncAge < 60 ? `Synced ${state.syncAge}s ago` : `Synced ${Math.floor(state.syncAge / 60)}m ago`;
      $("#sbNet").textContent = "Network idle · CDC poll 15s";
    } else {
      pill.className = "pill is-off";
      text.textContent = "Offline — working locally";
      $("#sbNet").textContent = "Network down · reads unaffected";
    }
    const pend = $("#pendPill");
    pend.hidden = state.pending === 0;
    $("#pendCount").textContent = state.pending;

    const fail = $("#failPill");
    fail.hidden = FAILURES.length === 0;
    fail.innerHTML = `<span class="dot"></span> ${FAILURES.length} need${FAILURES.length === 1 ? "s" : ""} you`;
    fail.onclick = () => go("failures");

    const t = document.getElementById("tPend");
    if (t) { t.textContent = state.pending; t.className = "strip-val" + (state.pending ? " warn" : ""); }
  }

  $("#netBtn").onclick = () => {
    state.online = !state.online;
    document.getElementById("offlineBar")?.remove();
    if (!state.online) {
      const bar = el("div", "offline-bar");
      bar.id = "offlineBar";
      bar.innerHTML = `<b>Network off.</b> Every screen still opens instantly — the data is already on this disk. Writes queue up and go out when you reconnect.`;
      $("#main").prepend(bar);
      toast("Network disconnected — nothing else changed", null, true);
    } else {
      toast("Reconnected");
      setTimeout(drain, 900);
    }
    updateChrome();
  };

  /* ─── display: text size and theme ──────────────────────────────────── */
  /* Preferences persist where storage is available; a sandboxed frame that
     refuses it just falls back to defaults rather than throwing. */
  const store = {
    get(k, d) { try { const v = localStorage.getItem("ll." + k); return v === null ? d : v; } catch { return d; } },
    set(k, v) { try { localStorage.setItem("ll." + k, v); } catch { /* not available */ } }
  };

  const FS_MIN = 0.9, FS_MAX = 1.7, FS_STEP = 0.1;

  function setFs(v, announce) {
    v = Math.round(Math.min(FS_MAX, Math.max(FS_MIN, v)) * 100) / 100;
    state.fs = v;
    document.documentElement.style.setProperty("--fs", v);
    $("#sbFs").textContent = Math.round(v * 100) + "%";
    $("#fsDown").disabled = v <= FS_MIN + 0.001;
    $("#fsUp").disabled = v >= FS_MAX - 0.001;
    store.set("fs", v);
    if (announce) toast(`Text ${Math.round(v * 100)}%`, null, false, "display");
  }

  function effectiveTheme() {
    return document.documentElement.getAttribute("data-theme")
        || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  }

  function setTheme(t, announce) {
    document.documentElement.setAttribute("data-theme", t);
    store.set("theme", t);
    $("#lightBtn").setAttribute("aria-pressed", String(t === "light"));
    $("#darkBtn").setAttribute("aria-pressed", String(t === "dark"));
    if (announce) toast(t === "dark" ? "Dark mode" : "Light mode", null, false, "display");
  }

  $("#fsUp").onclick    = () => setFs(state.fs + FS_STEP, true);
  $("#fsDown").onclick  = () => setFs(state.fs - FS_STEP, true);
  $("#lightBtn").onclick = () => setTheme("light", true);
  $("#darkBtn").onclick  = () => setTheme("dark", true);

  $("#coBtn").onclick = () => {
    const aqua = $("#coName").textContent.startsWith("Aquamentor");
    $("#coName").textContent = aqua ? "WaterLine CNC" : "Aquamentor, Inc.";
    $("#coRealm").textContent = aqua ? "1234567890123457" : "1234567890123456";
    $("#coDot").style.background = aqua ? "var(--ok)" : "var(--accent)";
    $("#sbRows").textContent = aqua ? "6,204" : "41,882";
    toast(`Switched to ${aqua ? "WaterLine CNC" : "Aquamentor"} — separate books, nothing shared`, readMs() + " ms");
  };

  setInterval(() => {
    if (!state.online) return;
    state.syncAge += 1;
    if (state.syncAge > 15) state.syncAge = 0;
    updateChrome();
  }, 1000);

  /* ─── command palette ───────────────────────────────────────────────── */
  let palRows = [], palIdx = 0;

  function palCommands() {
    const rows = [];
    NAV.forEach(n => rows.push({ sec: "Go to", glyph: n.glyph, title: n.label, meta: "", act: () => go(n.id) }));
    rows.push(
      { sec: "Display", glyph: "A", title: "Bigger text",  meta: "⌘⇧+", act: () => setFs(state.fs + FS_STEP, true) },
      { sec: "Display", glyph: "A", title: "Smaller text", meta: "⌘⇧−", act: () => setFs(state.fs - FS_STEP, true) },
      { sec: "Display", glyph: "A", title: "Reset text size", meta: "100%", act: () => setFs(1, true) },
      { sec: "Display", glyph: "☀", title: "Switch to light mode", meta: "", act: () => setTheme("light", true) },
      { sec: "Display", glyph: "☾", title: "Switch to dark mode",  meta: "", act: () => setTheme("dark", true) },
      { sec: "Display", glyph: "⇅", title: "Toggle the network",   meta: "", act: () => $("#netBtn").click() }
    );
    return rows;
  }

  const SEC_OF = {
    invoice: "Invoices", estimate: "Estimates", po: "Purchase orders",
    bill: "Bills", credit: "Vendor credits", payment: "Payments",
    customer: "Customers", item: "Items"
  };

  function fuzzy(hay, needle) {
    hay = hay.toLowerCase(); needle = needle.toLowerCase();
    let n = 0;
    for (const ch of hay) if (ch === needle[n]) n++;
    return n === needle.length;
  }

  /* A typed reference is the fast path. It might be an invoice number, an
     estimate number, a customer's own PO (often alphanumeric — KA-2026-4417),
     a tracking number or an amount. Match every key a record is known by and
     say which one hit, rather than making the user pick a field first. */
  const normalise = q => q.replace(/[#$,]/g, "").trim().toLowerCase();
  const looksLikeReference = q => /\d/.test(q);

  function renderPal(q) {
    const t0 = performance.now();
    const list = $("#palList");
    list.innerHTML = "";

    const index = searchIndex();
    const commands = palCommands();
    const scanned = index.length + commands.length;
    const needle = normalise(q);
    const isRef = looksLikeReference(q);
    let out = [];

    if (!q) {
      out = commands.concat(index.map(r => ({
        sec: SEC_OF[r.kind] || "Records", glyph: r.glyph, title: r.title,
        meta: r.meta, act: r.act, score: 0
      })));
    } else {
      // Commands rank below records for a reference-shaped query.
      commands.filter(c => fuzzy(c.title + " " + c.sec, q)).forEach(c =>
        out.push({ ...c, score: isRef ? 50 : 700 }));

      index.forEach(r => {
        const hit = scoreKeys(r, needle);
        const byTitle = fuzzy(r.title + " " + (SEC_OF[r.kind] || ""), q);
        if (!hit && !byTitle) return;
        out.push({
          sec: SEC_OF[r.kind] || "Records",
          glyph: r.glyph, title: r.title, meta: r.meta, act: r.act,
          why: hit ? hit.why : null,
          exact: hit ? hit.exact : false,
          score: hit ? hit.score : 400
        });
      });
      out.sort((a, b) => b.score - a.score);
    }

    palRows = out.slice(0, 40);
    palIdx = 0;

    if (!palRows.length) {
      list.innerHTML = `<div class="pal-empty">Nothing matches “${esc(q)}”.<br>
        <span class="dim">Every record is on this disk, so this is the whole book — not a slow server.</span></div>`;
      $("#palTime").textContent = "";
      return;
    }

    let sec = null;
    palRows.forEach((r, n) => {
      if (r.sec !== sec) { sec = r.sec; list.appendChild(el("div", "pal-sec lbl", sec)); }
      const b = el("button", "pal-item");
      b.dataset.active = String(n === 0);
      b.dataset.n = String(n);
      b.innerHTML = `<span class="pi-glyph" aria-hidden="true">${r.glyph}</span>
                     <span class="pi-main">${esc(r.title)}</span>
                     ${r.why ? `<span class="pi-why${r.exact ? "" : " soft"}">${esc(r.why)}</span>` : ""}
                     <span class="pi-meta">${r.meta}</span>`;
      b.onmouseenter = () => setPalIdx(n);
      b.onclick = () => { closePal(); r.act(); };
      list.appendChild(b);
    });

    $("#palTime").textContent =
      `${palRows.length} of ${scanned} in ${(performance.now() - t0).toFixed(1)} ms`;
  }

  function setPalIdx(n) {
    palIdx = Math.max(0, Math.min(palRows.length - 1, n));
    document.querySelectorAll(".pal-item").forEach(b => b.dataset.active = String(Number(b.dataset.n) === palIdx));
    const active = document.querySelector('.pal-item[data-active="true"]');
    if (active) active.scrollIntoView({ block: "nearest" });
  }

  function openPal() {
    $("#scrim").hidden = false;
    $("#palInput").value = "";
    renderPal("");
    $("#palInput").focus();
  }
  function closePal() { $("#scrim").hidden = true; $("#main").focus(); }

  $("#omniBtn").onclick = openPal;
  $("#palInput").oninput = e => renderPal(e.target.value.trim());
  $("#scrim").onclick = e => { if (e.target === $("#scrim")) closePal(); };

  document.addEventListener("keydown", e => {
    const open = !$("#scrim").hidden;
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); open ? closePal() : openPal(); return; }
    if ((e.metaKey || e.ctrlKey) && e.shiftKey && (e.key === "+" || e.key === "=")) {
      e.preventDefault(); setFs(state.fs + FS_STEP, true); return;
    }
    if ((e.metaKey || e.ctrlKey) && e.shiftKey && (e.key === "_" || e.key === "-")) {
      e.preventDefault(); setFs(state.fs - FS_STEP, true); return;
    }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s") {
      e.preventDefault();
      if (state.view === "invoice") commitLocally(state.arg);
      return;
    }
    if (!open) return;
    if (e.key === "Escape") { e.preventDefault(); closePal(); }
    else if (e.key === "ArrowDown") { e.preventDefault(); setPalIdx(palIdx + 1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); setPalIdx(palIdx - 1); }
    else if (e.key === "Enter") {
      e.preventDefault();
      const r = palRows[palIdx];
      if (r) { closePal(); r.act(); }
    }
  });

  /* ─── boot ──────────────────────────────────────────────────────────── */
  setFs(parseFloat(store.get("fs", 1)) || 1);
  setTheme(store.get("theme", null) || effectiveTheme());
  renderRail();
  go("today");
  updateChrome();
  setTimeout(() => toast("Replica current — 41,882 records on disk", "2.1 s"), 700);
})();
</script>
