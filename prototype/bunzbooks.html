          <div class="strip-cell"><div class="lbl">Open estimates</div><div class="strip-val">${money(open.reduce((a, e) => a + e.total, 0))}</div><div class="strip-note">${open.length} awaiting a decision</div></div>
          <div class="strip-cell"><div class="lbl">Accepted, not invoiced</div><div class="strip-val warn">${money(ESTIMATES.filter(e => e.status === "Accepted").reduce((a, e) => a + estProgress(e).remaining, 0))}</div><div class="strip-note">accepted but not yet billed</div></div>
          <div class="strip-cell"><div class="lbl">Invoiced to date</div><div class="strip-val pos">${money(ESTIMATES.reduce((a, e) => a + estProgress(e).invoiced, 0))}</div><div class="strip-note">across all estimates</div></div>
          <div class="strip-cell"><div class="lbl">Expired</div><div class="strip-val">${money(ESTIMATES.filter(e => e.status === "Expired").reduce((a, e) => a + e.total, 0))}</div><div class="strip-note">past their date</div></div>
        </div>
        <div class="grid-wrap"><div class="grid-scroll"><table>
          <thead><tr><th>No.</th><th>Date</th><th>Customer</th><th>Customer PO</th><th>Class</th><th class="r">Total</th><th>Expires</th><th>Status</th><th class="r">Billed</th><th style="width:118px">Progress</th></tr></thead>
          <tbody>${ESTIMATES.map(e => `
            <tr data-clickable data-est="${e.no}">
              <td class="mono">${e.no}</td>
              <td class="mono dim">${e.date}</td>
              <td class="trunc">${esc(cust(e.cust).short)}</td>
              <td class="mono dim">${e.custPO ? esc(e.custPO) : "—"}</td>
              <td><span class="swatch" style="background:${cls(e.cls).color}"></span><span class="dim">${cls(e.cls).name}</span></td>
              <td class="r num">${plain(e.total)}</td>
              <td class="mono dim">${e.expires}</td>
              <td>${e.status === "Accepted" ? '<span class="tag ok">accepted</span>' : e.status === "Expired" ? '<span class="tag crit">expired</span>' : '<span class="tag warn">pending</span>'}</td>
              <td class="r num">${estProgress(e).pct ? estProgress(e).pct + "%" : '<span class="dim">—</span>'}</td>
              <td>${estProgress(e).count
                ? `<div class="bar-track" title="${estProgress(e).count} invoice(s)"><div class="bar-fill" style="width:${estProgress(e).pct}%;background:${estProgress(e).pct === 100 ? "var(--ok)" : "var(--warn)"}"></div></div>`
                : '<span class="dim">not billed</span>'}</td>
            </tr>`).join("")}</tbody>
        </table></div></div>
        <p class="hint">An accepted estimate under 100% billed still has money in it. A part-filled bar is work you have done and not yet invoiced.</p>
      </div>`;
    },

    estimate(no) {
      const e = ESTIMATES.find(x => x.no === no) || ESTIMATES[0];
      const c = cust(e.cust);
      const pr = estProgress(e);
      const actions = pr.remaining > 0
        ? `${pr.invoiced ? "" : `<button class="btn" data-progress="${e.no}:50">Invoice 50% deposit</button>`}
           <button class="btn btn-primary" data-progress="${e.no}:rest">Invoice remaining ${plain(pr.remaining)}</button>`
        : `<span class="tag ok" style="align-self:center">billed in full</span>`;
      return head("Estimate " + e.no, `${esc(c.short)} · expires ${e.expires}`,
        `<button class="btn" data-go="estimates">← Back</button>${actions}`)
        + lineageRail("estimate", e.no) + `
      <div class="pad">
        <div class="split">
          <div class="panel">
            <div class="doc-head">
              <div class="field"><span class="lbl">Customer</span><span class="field-val">${esc(c.short)}</span></div>
              <div class="field"><span class="lbl">Date</span><span class="field-val mono">${e.date}</span></div>
              <div class="field"><span class="lbl">Expires</span><span class="field-val mono">${e.expires}</span></div>
              <div class="field"><span class="lbl">Customer PO</span><span class="field-val mono">${e.custPO ? esc(e.custPO) : '<span class="dim">not supplied</span>'}</span></div>
              <div class="field"><span class="lbl">Class</span><span class="field-val"><span class="swatch" style="background:${cls(e.cls).color}"></span>${cls(e.cls).name}</span></div>
              <div class="field"><span class="lbl">Status</span><span class="field-val">${e.status}</span></div>
            </div>
            ${e.lines ? `<div class="grid-scroll"><table>
              <thead><tr><th style="width:34px">#</th><th>Item</th><th>Description</th><th class="r">Qty</th><th class="r">Rate</th><th class="r">Amount</th></tr></thead>
              <tbody>${e.lines.map((l, n) => {
                const it = item(l.sku);
                return `<tr><td class="mono dim">${n + 1}</td><td class="mono">${esc(l.sku)}</td>
                  <td class="trunc dim">${esc(it ? it.desc : "")}</td>
                  <td class="r num">${l.qty}</td><td class="r num">${plain(l.rate)}</td>
                  <td class="r num">${plain(l.qty * l.rate)}</td></tr>`; }).join("")}</tbody>
            </table></div>` : ""}
            <div class="totals"><dl>
              <div class="grand" style="display:contents"><dt>Total</dt><dd>${plain(e.total)}</dd></div>
            </dl></div>
          </div>
          <div>
            <div class="panel" style="margin-bottom:14px">
              <div class="panel-head"><span class="lbl">Billing progress</span>
                <span class="spacer" style="flex:1"></span>
                <span class="tag ${pr.pct === 100 ? "ok" : pr.pct ? "warn" : ""}">${pr.pct}% billed</span></div>
              <div class="panel-body">
                <div class="bar-track" style="height:7px"><div class="bar-fill" style="width:${pr.pct}%;background:${pr.pct === 100 ? "var(--ok)" : "var(--warn)"}"></div></div>
                <dl class="kv" style="margin-top:11px">
                  <dt>Estimate</dt><dd class="num">${plain(e.total)}</dd>
                  <dt>Invoiced</dt><dd class="num">${plain(pr.invoiced)}</dd>
                  <dt>Remaining</dt><dd class="num" style="color:${pr.remaining ? "var(--warn)" : "var(--ok)"}">${plain(pr.remaining)}</dd>
                </dl>
                ${pr.count ? `<div style="margin-top:9px">${(e.progress || []).map(x => `
                  <button class="link-row" data-inv="${x.inv}">
                    <span class="link-glyph" aria-hidden="true">▤</span>
                    <span class="link-main"><b>Invoice ${x.inv} — ${plain(x.amount)}</b>
                      <div class="link-sub">${x.pct}% · ${x.date}${x.note ? " · " + esc(x.note) : ""}</div></span>
                    <span class="dim" aria-hidden="true">›</span>
                  </button>`).join("")}</div>` : `<p class="hint" style="margin-top:9px">Nothing billed against this estimate yet.</p>`}
              </div>
            </div>
            <div class="panel">
              <div class="panel-head"><span class="lbl">${esc(c.short)}</span></div>
              <div class="panel-body">
                <dl class="kv">
                  <dt>Location</dt><dd>${esc(c.city)}</dd>
                  <dt>Terms</dt><dd>${esc(c.terms)}</dd>
                  <dt>Sales YTD</dt><dd class="num">${plain(c.ytd)}</dd>
                </dl>
                <button class="btn" style="margin-top:10px;width:100%" data-cust="${c.id}">Full history</button>
              </div>
            </div>
          </div>
        </div>
      </div>`;
    },

    po(no) {
      const o = POS.find(x => x.no === no) || POS[0];
      const bill = BILLS.find(b => b.no === o.bill);
      const inv = o.forInvoice ? INVOICES.find(i => i.no === o.forInvoice) : null;
      const margin = inv ? Math.round((inv.total - o.total) / inv.total * 100) : null;
      const rc = poReceipt(o);
      return head(o.no, `${esc(o.vendor)} · ${o.date}`,
        `<button class="btn" data-go="pos">← Back</button>
         ${rc.received < rc.ordered ? `<button class="btn btn-primary" data-receive="${o.no}">Receive items</button>` : ""}
         ${bill ? `<button class="btn">Open bill ${bill.no}</button>` : `<button class="btn">Convert to bill</button>`}`)
        + lineageRail("po", o.no) + `
      <div class="pad">
        <div class="split">
          <div class="panel">
            <div class="doc-head">
              <div class="field"><span class="lbl">Vendor</span><span class="field-val">${esc(o.vendor)}</span></div>
              <div class="field"><span class="lbl">Date</span><span class="field-val mono">${o.date}</span></div>
              <div class="field"><span class="lbl">Class</span><span class="field-val"><span class="swatch" style="background:${cls(o.cls).color}"></span>${cls(o.cls).name}</span></div>
              <div class="field"><span class="lbl">Received</span><span class="field-val">${rc.received} of ${rc.ordered} units · ${rc.pct}%</span></div>
              <div class="field"><span class="lbl">Ordered value</span><span class="field-val num">${plain(o.total)}</span></div>
              <div class="field"><span class="lbl">Status</span><span class="field-val">${rc.status}${rc.status === "Partial" ? ` · ${plain(rc.value)} received` : ""}</span></div>
            </div>

            <div class="panel-head" style="border-top:1px solid var(--line)"><span class="lbl">Lines — ordered against received</span>
              <span class="spacer" style="flex:1"></span>
              <span class="tag ${rc.status === "Received" ? "ok" : rc.status === "Partial" ? "warn" : ""}">${rc.status.toLowerCase()}</span></div>
            <div class="grid-scroll"><table>
              <thead><tr><th>Item</th><th>Description</th><th class="r">Ordered</th><th class="r">Received</th><th class="r">Remaining</th><th style="width:110px"></th></tr></thead>
              <tbody>${o.lines.map(l => `
                <tr>
                  <td class="mono">${esc(l.sku)}</td>
                  <td class="trunc dim">${esc(l.desc)}</td>
                  <td class="r num">${l.qty}</td>
                  <td class="r num">${l.recd}</td>
                  <td class="r num" style="color:${l.qty - l.recd ? "var(--warn)" : "var(--ok)"}">${l.qty - l.recd || "—"}</td>
                  <td><div class="bar-track"><div class="bar-fill" style="width:${l.qty ? l.recd / l.qty * 100 : 0}%;background:${l.recd === l.qty ? "var(--ok)" : "var(--warn)"}"></div></div></td>
                </tr>`).join("")}</tbody>
            </table></div>

            ${o.receipts.length ? `
            <div class="panel-head" style="border-top:1px solid var(--line)"><span class="lbl">Receipt history</span></div>
            <div class="panel-body" style="padding:2px 12px 10px">
              ${o.receipts.map(r => `
                <div class="link-row" style="cursor:default">
                  <span class="link-glyph" aria-hidden="true">✓</span>
                  <span class="link-main"><b>${esc(r.ref)}</b>
                    <div class="link-sub">${r.date} · ${esc(r.note)}</div></span>
                </div>`).join("")}
            </div>` : ""}
            ${inv ? `
            <div class="panel-head" style="border-top:1px solid var(--line)"><span class="lbl">Dropship — fulfils a customer order</span></div>
            <div class="grid-scroll"><table>
              <thead><tr><th>Customer invoice</th><th>Customer</th><th class="r">You charged</th><th class="r">Vendor cost</th><th class="r">Gross margin</th></tr></thead>
              <tbody><tr data-clickable data-inv="${inv.no}">
                <td class="mono">${inv.no}</td>
                <td class="trunc">${esc(cust(inv.cust).short)}</td>
                <td class="r num">${plain(inv.total)}</td>
                <td class="r num dim">${plain(o.total)}</td>
                <td class="r num" style="color:${margin > 30 ? "var(--ok)" : margin > 0 ? "var(--warn)" : "var(--crit)"}">${plain(inv.total - o.total)} · ${margin}%</td>
              </tr></tbody>
            </table></div>` : ""}
          </div>
          <div class="panel">
            <div class="panel-head"><span class="lbl">Linked records</span></div>
            <div class="panel-body" style="padding:2px 12px 10px">
              ${linkRows([
                bill ? { glyph: "▧", main: `${bill.no} — ${plain(bill.total)}`, sub: `Vendor bill · due ${bill.due} · ${billStatus(bill).toLowerCase()}`, act: () => go("bill", bill.no) }
                     : { glyph: "▧", main: "No bill yet", sub: "This PO has not been billed", dead: true },
                inv ? { glyph: "▤", main: `Invoice ${inv.no}`, sub: `Dropship to ${cust(inv.cust).short}`, act: () => go("invoice", inv.no) }
                    : { glyph: "▤", main: "Not a dropship", sub: "Stock purchase, no customer order attached", dead: true }
              ])}
            </div>
          </div>
        </div>
      </div>`;
    },

    bills() {
      const openCredit = VENDORCREDITS.reduce((a, v) => a + vcRemaining(v), 0);
      return head("Bills", `${BILLS.length} from vendors · every one traced back to its PO`) + `
      <div class="pad">
        ${openCredit ? `<div class="strip" style="margin-bottom:14px">
          <div class="strip-cell"><div class="lbl">Owed to vendors</div><div class="strip-val">${money(BILLS.reduce((a, b) => a + billBalance(b), 0))}</div><div class="strip-note">across ${BILLS.filter(b => billBalance(b) > 0).length} open bills</div></div>
          <div class="strip-cell"><div class="lbl">Unapplied credit</div><div class="strip-val pos">${money(openCredit)}</div><div class="strip-note">money back you have not taken yet</div></div>
        </div>` : ""}
        <div class="grid-wrap"><div class="grid-scroll"><table>
          <thead><tr><th>No.</th><th>Date</th><th>Vendor</th><th>From PO</th><th class="r">Total</th><th class="r">Credits</th><th class="r">Paid</th><th class="r">Balance</th><th>Due</th><th>Status</th></tr></thead>
          <tbody>${BILLS.map(b => `
            <tr data-clickable data-bill="${b.no}">
              <td class="mono">${b.no}</td>
              <td class="mono dim">${b.date}</td>
              <td>${esc(b.vendor)}</td>
              <td>${b.po ? `<span class="tag acc">${b.po}</span>` : '<span class="dim">—</span>'}</td>
              <td class="r num">${plain(b.total)}</td>
              <td class="r num">${billCredited(b) ? `<span style="color:var(--ok)">−${plain(billCredited(b))}</span>` : '<span class="dim">—</span>'}</td>
              <td class="r num dim">${billPaid(b) ? plain(billPaid(b)) : "—"}</td>
              <td class="r num">${billBalance(b) ? plain(billBalance(b)) : '<span class="dim">—</span>'}</td>
              <td class="mono dim">${b.due}</td>
              <td>${billStatus(b) === "Paid" ? '<span class="tag ok">paid</span>' : billStatus(b) === "Partial" ? '<span class="tag warn">partial</span>' : '<span class="tag">open</span>'}</td>
            </tr>`).join("")}</tbody>
        </table></div></div>
        <p class="hint">Balance is total less credits less payments, computed from the records rather than stored — a bill and its credits cannot drift apart.</p>
      </div>`;
    },

    bill(no) {
      const b = BILLS.find(x => x.no === no) || BILLS[0];
      const credits = billCredits(b);
      const pays = BILLPAYMENTS.filter(x => x.bill === b.no);
      const bal = billBalance(b);
      const available = VENDORCREDITS.filter(v => v.vendor === b.vendor && vcRemaining(v) > 0);
      return head(b.no, `${esc(b.vendor)} · due ${b.due}`,
        `<button class="btn" data-go="bills">← Back</button>
         ${available.length && bal > 0 ? `<button class="btn btn-primary" data-applyvc="${available[0].no}:${b.no}">Apply ${plain(Math.min(vcRemaining(available[0]), bal))} credit</button>` : ""}
         ${bal > 0 ? `<button class="btn">Pay bill</button>` : `<span class="tag ok" style="align-self:center">settled</span>`}`)
        + lineageRail("bill", b.no) + `
      <div class="pad">
        <div class="split">
          <div class="panel">
            <div class="doc-head">
              <div class="field"><span class="lbl">Vendor</span><span class="field-val">${esc(b.vendor)}</span></div>
              <div class="field"><span class="lbl">Bill date</span><span class="field-val mono">${b.date}</span></div>
              <div class="field"><span class="lbl">Due</span><span class="field-val mono">${b.due}</span></div>
              <div class="field"><span class="lbl">From PO</span><span class="field-val mono">${b.po || "—"}</span></div>
              <div class="field"><span class="lbl">Status</span><span class="field-val">${billStatus(b)}</span></div>
            </div>
            <div class="panel-head" style="border-top:1px solid var(--line)"><span class="lbl">How this balance is reached</span></div>
            <div class="grid-scroll"><table>
              <tbody>
                <tr><td>Bill total</td><td class="r num">${plain(b.total)}</td><td class="dim" style="width:46%">as billed by ${esc(b.vendor)}</td></tr>
                ${credits.map(c => `<tr>
                  <td>Credit applied <span class="tag acc">${c.vc}</span></td>
                  <td class="r num" style="color:var(--ok)">−${plain(c.amount)}</td>
                  <td class="dim">${c.date}</td></tr>`).join("")}
                ${pays.map(x => `<tr>
                  <td>Payment ${x.no}</td>
                  <td class="r num dim">−${plain(x.amount)}</td>
                  <td class="dim">${x.date} · ${esc(x.method)}</td></tr>`).join("")}
                <tr style="border-top:1px solid var(--line)">
                  <td style="font-weight:600">Balance due</td>
                  <td class="r num" style="font-weight:600;color:${bal > 0 ? "var(--warn)" : "var(--ok)"}">${plain(bal)}</td>
                  <td class="dim">${bal > 0 ? "still owed" : "settled"}</td></tr>
              </tbody>
            </table></div>
          </div>
          <div>
            <div class="panel" style="margin-bottom:14px">
              <div class="panel-head"><span class="lbl">Credit available from ${esc(b.vendor)}</span></div>
              <div class="panel-body" style="padding:2px 12px 10px">
                ${available.length ? available.map(v => `
                  <button class="link-row" data-vc="${v.no}">
                    <span class="link-glyph" aria-hidden="true">◐</span>
                    <span class="link-main"><b>${v.no} — ${plain(vcRemaining(v))} unapplied</b>
                      <div class="link-sub">${esc(v.reason)}</div></span>
                    <span class="dim" aria-hidden="true">›</span>
                  </button>`).join("")
                : `<p class="hint" style="margin:8px 0">No unapplied credit from this vendor.</p>`}
              </div>
            </div>
            <div class="panel">
              <div class="panel-head"><span class="lbl">Linked records</span></div>
              <div class="panel-body" style="padding:2px 12px 10px">
                ${linkRows([ b.po
                  ? { glyph: "▥", main: b.po, sub: "Purchase order this bill came from" }
                  : { glyph: "▥", main: "No purchase order", sub: "Entered directly", dead: true } ])}
              </div>
            </div>
          </div>
        </div>
      </div>`;
    },

    credits() {
      const unapplied = VENDORCREDITS.reduce((a, v) => a + vcRemaining(v), 0);
      return head("Vendor credits", `${VENDORCREDITS.length} on file · ${money(unapplied)} not yet applied`) + `
      <div class="pad">
        <div class="strip">
          <div class="strip-cell"><div class="lbl">Issued</div><div class="strip-val">${money(VENDORCREDITS.reduce((a, v) => a + v.total, 0))}</div><div class="strip-note">total credited by vendors</div></div>
          <div class="strip-cell"><div class="lbl">Applied</div><div class="strip-val">${money(VENDORCREDITS.reduce((a, v) => a + vcApplied(v), 0))}</div><div class="strip-note">taken against bills</div></div>
          <div class="strip-cell"><div class="lbl">Unapplied</div><div class="strip-val pos">${money(unapplied)}</div><div class="strip-note">money back still on the table</div></div>
        </div>
        <div class="grid-wrap"><div class="grid-scroll"><table>
          <thead><tr><th>No.</th><th>Date</th><th>Vendor</th><th>Reason</th><th class="r">Amount</th><th class="r">Applied</th><th class="r">Available</th><th>Against</th></tr></thead>
          <tbody>${VENDORCREDITS.map(v => `
            <tr data-clickable ${v.applied.length ? `data-bill="${v.applied[0].bill}"` : ""}>
              <td class="mono">${v.no}</td>
              <td class="mono dim">${v.date}</td>
              <td>${esc(v.vendor)}</td>
              <td class="trunc dim">${esc(v.reason)}</td>
              <td class="r num">${plain(v.total)}</td>
              <td class="r num dim">${vcApplied(v) ? plain(vcApplied(v)) : "—"}</td>
              <td class="r num" style="color:${vcRemaining(v) ? "var(--ok)" : "var(--ink-dim)"}">${vcRemaining(v) ? plain(vcRemaining(v)) : "—"}</td>
              <td>${v.applied.length ? v.applied.map(a => `<span class="tag acc">${a.bill}</span>`).join(" ") : '<span class="tag warn">unapplied</span>'}</td>
            </tr>`).join("")}</tbody>
        </table></div></div>
        <p class="hint">An unapplied credit is money a vendor already agreed you are owed. It only reduces what you pay once it is applied to a bill.</p>
      </div>`;
    },

    payments() {
      return head("Payments received", `${PAYMENTS.length} applied to invoices`,
        `<button class="btn btn-primary" data-receivefrom="">Receive payment</button>`) + `
      <div class="pad">
        <div class="grid-wrap"><div class="grid-scroll"><table>
          <thead><tr><th>No.</th><th>Date</th><th>Customer</th><th>Applied to</th><th class="r">Amount</th><th>Method</th></tr></thead>
          <tbody>${PAYMENTS.map(pm => `
            <tr data-clickable data-inv="${pm.inv}">
              <td class="mono">${pm.no}</td>
              <td class="mono dim">${pm.date}</td>
              <td class="trunc">${esc(cust(pm.cust).short)}</td>
              <td><span class="tag acc">inv ${pm.inv}</span></td>
              <td class="r num">${plain(pm.amount)}</td>
              <td class="dim">${esc(pm.method)}</td>
            </tr>`).join("")}</tbody>
        </table></div></div>
      </div>`;
    },

    vendors() {
      const owed = n => BILLS.filter(b => b.vendor === n).reduce((a, b) => a + billBalance(b), 0);
      const credit = n => VENDORCREDITS.filter(v => v.vendor === n).reduce((a, v) => a + vcRemaining(v), 0);
      return head("Vendors", `${VENDORS.length} on file · ${VENDORS.filter(v => v.is1099).length} tracked for 1099-NEC`) + `
      <div class="pad">
        <div class="grid-wrap"><div class="grid-scroll"><table>
          <thead><tr><th>Vendor</th><th>Location</th><th>What you buy</th><th>Terms</th><th>1099</th><th class="r">Open bills</th><th class="r">Unapplied credit</th><th class="r">Spend YTD</th></tr></thead>
          <tbody>${[...VENDORS].sort((a, b) => owed(b.name) - owed(a.name)).map(v => `
            <tr data-clickable data-vendor="${esc(v.name)}">
              <td>${esc(v.name)}</td>
              <td class="dim">${esc(v.city)}</td>
              <td class="trunc dim">${esc(v.buys)}</td>
              <td class="dim">${esc(v.terms)}</td>
              <td>${v.is1099 ? '<span class="tag acc">1099-NEC</span>' : '<span class="dim">—</span>'}</td>
              <td class="r num">${owed(v.name) ? plain(owed(v.name)) : '<span class="dim">—</span>'}</td>
              <td class="r num" style="color:${credit(v.name) ? "var(--ok)" : "var(--ink-dim)"}">${credit(v.name) ? plain(credit(v.name)) : "—"}</td>
              <td class="r num dim">${plain(v.ytd)}</td>
            </tr>`).join("")}</tbody>
        </table></div></div>
      </div>`;
    },

    vendor(name) {
      const v = vendor(name) || VENDORS[0];
      const pos = POS.filter(o => o.vendor === v.name);
      const bills = BILLS.filter(b => b.vendor === v.name);
      const creds = VENDORCREDITS.filter(c => c.vendor === v.name);
      const owed = bills.reduce((a, b) => a + billBalance(b), 0);
      const credit = creds.reduce((a, c) => a + vcRemaining(c), 0);
      return head(v.name, `${esc(v.city)} · ${esc(v.terms)}`,
        `<button class="btn" data-go="vendors">← Back</button>
         <button class="btn btn-primary">New purchase order</button>`) + `
      <div class="pad">
        <div class="strip">
          <div class="strip-cell"><div class="lbl">Open bills</div><div class="strip-val ${owed ? "warn" : "pos"}">${money(owed)}</div><div class="strip-note">${bills.filter(b => billBalance(b) > 0).length} unpaid</div></div>
          <div class="strip-cell"><div class="lbl">Unapplied credit</div><div class="strip-val ${credit ? "pos" : ""}">${money(credit)}</div><div class="strip-note">${credit ? "apply before paying" : "none outstanding"}</div></div>
          <div class="strip-cell"><div class="lbl">Open POs</div><div class="strip-val">${money(pos.filter(o => poReceipt(o).status !== "Received").reduce((a, o) => a + o.total, 0))}</div><div class="strip-note">${pos.filter(o => poReceipt(o).status !== "Received").length} outstanding</div></div>
          <div class="strip-cell"><div class="lbl">Spend YTD</div><div class="strip-val">${money(v.ytd)}</div><div class="strip-note">${esc(v.buys)}</div></div>
          <div class="strip-cell"><div class="lbl">1099-NEC</div><div class="strip-val" style="font-size:calc(15px * var(--fs))">${v.is1099 ? "Tracked" : "Not tracked"}</div><div class="strip-note">${esc(v.contact)}</div></div>
        </div>

        <div class="panel" style="margin-bottom:14px">
          <div class="panel-head"><span class="lbl">Purchase orders</span></div>
          <div class="grid-scroll"><table>
            <thead><tr><th>No.</th><th>Date</th><th class="r">Total</th><th class="r">Received</th><th style="width:110px">Progress</th><th>Status</th></tr></thead>
            <tbody>${pos.length ? pos.map(o => { const rc = poReceipt(o); return `
              <tr data-clickable data-po="${o.no}">
                <td class="mono">${o.no}</td><td class="mono dim">${o.date}</td>
                <td class="r num">${plain(o.total)}</td>
                <td class="r num dim">${rc.received} / ${rc.ordered}</td>
                <td><div class="bar-track"><div class="bar-fill" style="width:${rc.pct}%;background:${rc.pct === 100 ? "var(--ok)" : rc.pct ? "var(--warn)" : "var(--surface-3)"}"></div></div></td>
                <td>${rc.status === "Received" ? '<span class="tag ok">received</span>' : rc.status === "Partial" ? '<span class="tag warn">partial</span>' : '<span class="tag">open</span>'}</td>
              </tr>`; }).join("") : '<tr><td colspan="6" class="dim">No purchase orders</td></tr>'}</tbody>
          </table></div>
        </div>

        <div class="split">
          <div class="panel">
            <div class="panel-head"><span class="lbl">Bills</span></div>
            <div class="grid-scroll"><table>
              <thead><tr><th>No.</th><th>Date</th><th class="r">Total</th><th class="r">Balance</th><th>Status</th></tr></thead>
              <tbody>${bills.length ? bills.map(b => `
                <tr data-clickable data-bill="${b.no}">
                  <td class="mono">${b.no}</td><td class="mono dim">${b.date}</td>
                  <td class="r num">${plain(b.total)}</td>
                  <td class="r num">${billBalance(b) ? plain(billBalance(b)) : '<span class="dim">—</span>'}</td>
                  <td>${billStatus(b) === "Paid" ? '<span class="tag ok">paid</span>' : billStatus(b) === "Partial" ? '<span class="tag warn">partial</span>' : '<span class="tag">open</span>'}</td>
                </tr>`).join("") : '<tr><td colspan="5" class="dim">No bills</td></tr>'}</tbody>
            </table></div>
          </div>
          <div class="panel">
            <div class="panel-head"><span class="lbl">Credits</span></div>
            <div class="panel-body" style="padding:2px 12px 10px">
              ${creds.length ? creds.map(c => `
                <button class="link-row" data-go="credits">
                  <span class="link-glyph" aria-hidden="true">◐</span>
                  <span class="link-main"><b>${c.no} — ${plain(vcRemaining(c))} available</b>
                    <div class="link-sub">${esc(c.reason)}</div></span>
                  <span class="dim" aria-hidden="true">›</span>
                </button>`).join("") : '<p class="hint" style="margin:8px 0">No credits from this vendor.</p>'}
            </div>
          </div>
        </div>
      </div>`;
    },

    item(sku) {
      const it = item(sku) || ITEMS[0];
      const margin = it.price ? (it.price - it.cost) / it.price : 0;
      /* Where-used: every document carrying this item. This is the question a
         SKU page actually has to answer. */
      const onInvoices = INVOICES.filter(i => (i.lines || []).some(l => l.sku === it.sku));
      const onEstimates = ESTIMATES.filter(e => (e.lines || []).some(l => l.sku === it.sku));
      const sold = onInvoices.reduce((a, i) =>
        a + (i.lines || []).filter(l => l.sku === it.sku).reduce((x, l) => x + l.qty, 0), 0);
      const revenue = onInvoices.reduce((a, i) =>
        a + (i.lines || []).filter(l => l.sku === it.sku).reduce((x, l) => x + l.qty * l.rate, 0), 0);
      return head(it.sku, esc(it.desc),
        `<button class="btn" data-go="items">← Back</button>`) + `
      <div class="pad">
        <div class="strip">
          <div class="strip-cell"><div class="lbl">Price</div><div class="strip-val">${money(it.price)}</div><div class="strip-note">${it.type.toLowerCase()}</div></div>
          <div class="strip-cell"><div class="lbl">Cost</div><div class="strip-val">${money(it.cost)}</div><div class="strip-note">last landed</div></div>
          <div class="strip-cell"><div class="lbl">Gross margin</div><div class="strip-val ${margin > .5 ? "pos" : margin > .3 ? "" : "warn"}">${Math.round(margin * 100)}%</div><div class="strip-note">${money(it.price - it.cost)} per unit</div></div>
          <div class="strip-cell"><div class="lbl">On hand</div><div class="strip-val">${it.hand == null ? "—" : it.hand}</div><div class="strip-note">${it.hand == null ? "not stocked" : "units"}</div></div>
          <div class="strip-cell"><div class="lbl">Sold this year</div><div class="strip-val">${sold}</div><div class="strip-note">${money(revenue)} revenue</div></div>
        </div>
        <div class="grid-wrap"><div class="grid-scroll"><table>
          <thead><tr><th>Document</th><th>Date</th><th>Party</th><th class="r">Qty</th><th class="r">Rate</th><th class="r">Amount</th></tr></thead>
          <tbody>${
            onInvoices.flatMap(i => (i.lines || []).filter(l => l.sku === it.sku).map(l => `
              <tr data-clickable data-inv="${i.no}">
                <td><span class="tag">invoice</span> <span class="mono">${i.no}</span></td>
                <td class="mono dim">${i.date}</td>
                <td class="trunc">${esc(cust(i.cust).short)}</td>
                <td class="r num">${l.qty}</td><td class="r num">${plain(l.rate)}</td>
                <td class="r num">${plain(l.qty * l.rate)}</td>
              </tr>`)).join("")
            + onEstimates.flatMap(e => (e.lines || []).filter(l => l.sku === it.sku).map(l => `
              <tr data-clickable data-est="${e.no}">
                <td><span class="tag acc">estimate</span> <span class="mono">${e.no}</span></td>
                <td class="mono dim">${e.date}</td>
                <td class="trunc">${esc(cust(e.cust).short)}</td>
                <td class="r num">${l.qty}</td><td class="r num">${plain(l.rate)}</td>
                <td class="r num">${plain(l.qty * l.rate)}</td>
              </tr>`)).join("")
            || '<tr><td colspan="6" class="dim">Not on any document yet</td></tr>'}</tbody>
        </table></div></div>
      </div>`;
    },

    pnl() {
      /* Revenue and COGS per class — the report the class dimension exists to
         make possible. Computed from documents, never from a stored total. */
      const rows = CLASSES.map(c => {
        const invs = INVOICES.filter(i => i.cls === c.id);
        let rev = 0, cogs = 0;
        invs.forEach(i => (i.lines || []).forEach(l => {
          const it = item(l.sku); if (!it) return;
          rev += l.qty * l.rate;
          cogs += l.qty * it.cost;
        }));
        return { c, rev, cogs, gp: rev - cogs, margin: rev ? (rev - cogs) / rev : 0, count: invs.length };
      }).filter(r => r.rev > 0).sort((a, b) => b.rev - a.rev);

      const tRev = rows.reduce((a, r) => a + r.rev, 0);
      const tCogs = rows.reduce((a, r) => a + r.cogs, 0);
      const tGp = tRev - tCogs;

      return head("Profit & loss by product line", "Accrual basis · 2026 to date · computed from documents") + `
      <div class="pad">
        <div class="strip">
          <div class="strip-cell"><div class="lbl">Revenue</div><div class="strip-val">${money(tRev)}</div><div class="strip-note">${INVOICES.length} invoices</div></div>
          <div class="strip-cell"><div class="lbl">Cost of goods</div><div class="strip-val">${money(tCogs)}</div><div class="strip-note">at last landed cost</div></div>
          <div class="strip-cell"><div class="lbl">Gross profit</div><div class="strip-val pos">${money(tGp)}</div><div class="strip-note">before operating expense</div></div>
          <div class="strip-cell"><div class="lbl">Gross margin</div><div class="strip-val ${tRev && tGp / tRev > .4 ? "pos" : "warn"}">${tRev ? Math.round(tGp / tRev * 100) : 0}%</div><div class="strip-note">blended across lines</div></div>
        </div>
        <div class="grid-wrap"><div class="grid-scroll"><table>
          <thead><tr><th>Product line</th><th class="r">Invoices</th><th class="r">Revenue</th><th class="r">% of revenue</th><th class="r">COGS</th><th class="r">Gross profit</th><th class="r">Margin</th><th style="width:132px"></th></tr></thead>
          <tbody>${rows.map(r => `
            <tr>
              <td><span class="swatch" style="background:${r.c.color}"></span>${esc(r.c.name)}</td>
              <td class="r num dim">${r.count}</td>
              <td class="r num">${plain(r.rev)}</td>
              <td class="r num dim">${tRev ? Math.round(r.rev / tRev * 100) : 0}%</td>
              <td class="r num dim">${plain(r.cogs)}</td>
              <td class="r num">${plain(r.gp)}</td>
              <td class="r num" style="color:${r.margin > .5 ? "var(--ok)" : r.margin > .3 ? "var(--ink)" : "var(--warn)"}">${Math.round(r.margin * 100)}%</td>
              <td><div class="bar-track"><div class="bar-fill" style="width:${Math.round(r.margin * 100)}%;background:${r.c.color}"></div></div></td>
            </tr>`).join("")}
            <tr style="border-top:1px solid var(--line)">
              <td style="font-weight:600">Total</td>
              <td class="r num dim">${rows.reduce((a, r) => a + r.count, 0)}</td>
              <td class="r num" style="font-weight:600">${plain(tRev)}</td>
              <td class="r num dim">100%</td>
              <td class="r num dim">${plain(tCogs)}</td>
              <td class="r num" style="font-weight:600">${plain(tGp)}</td>
              <td class="r num" style="font-weight:600">${tRev ? Math.round(tGp / tRev * 100) : 0}%</td>
              <td></td>
            </tr>
          </tbody>
        </table></div></div>
        <p class="hint">Bars are gross margin, not revenue — a line can be large and thin, or small and fat, and the two questions are different.</p>
      </div>`;
    },

    aging(custId) {
      const open = INVOICES.filter(i => i.bal > 0);
      const bucketOf = i => i.age <= 30 ? 0 : i.age <= 60 ? 1 : i.age <= 90 ? 2 : 3;
      const names = ["Current", "31–60", "61–90", "90+"];
      const byCust = CUSTOMERS.map(c => {
        const rows = open.filter(i => i.cust === c.id);
        const b = [0, 0, 0, 0];
        rows.forEach(i => { b[bucketOf(i)] += i.bal; });
        return { c, b, total: b.reduce((x, y) => x + y, 0) };
      }).filter(r => r.total > 0).sort((a, b) => b.total - a.total);
      const totals = [0, 1, 2, 3].map(n => byCust.reduce((a, r) => a + r.b[n], 0));
      const grand = totals.reduce((a, b) => a + b, 0);

      return head("A/R aging", `As of 20 August 2026 · accrual basis · ${open.length} open invoices`) + `
      <div class="pad">
        <div class="strip">
          ${names.map((n, i) => `<div class="strip-cell"><div class="lbl">${n}</div>
            <div class="strip-val ${i === 0 ? "pos" : i === 3 ? "neg" : "warn"}">${money(totals[i])}</div>
            <div class="strip-note">${grand ? Math.round(totals[i] / grand * 100) : 0}% of total</div></div>`).join("")}
          <div class="strip-cell"><div class="lbl">Total due</div><div class="strip-val">${money(grand)}</div><div class="strip-note">${byCust.length} customers</div></div>
        </div>
        <div class="grid-wrap"><div class="grid-scroll"><table>
          <thead><tr><th>Customer</th>${names.map(n => `<th class="r">${n}</th>`).join("")}<th class="r">Total</th><th>Terms</th></tr></thead>
          <tbody>${byCust.map(r => `
            <tr data-clickable data-cust="${r.c.id}">
              <td class="trunc">${esc(r.c.short)}</td>
              ${r.b.map((v, i) => `<td class="r num" style="color:${!v ? "var(--ink-dim)" : i === 3 ? "var(--crit)" : i === 0 ? "var(--ink)" : "var(--warn)"}">${v ? plain(v) : "—"}</td>`).join("")}
              <td class="r num" style="font-weight:500">${plain(r.total)}</td>
              <td class="dim">${esc(r.c.terms)}</td>
            </tr>`).join("")}
            <tr style="border-top:1px solid var(--line)">
              <td style="font-weight:600">Total</td>
              ${totals.map(v => `<td class="r num" style="font-weight:600">${plain(v)}</td>`).join("")}
              <td class="r num" style="font-weight:600">${plain(grand)}</td><td></td>
            </tr></tbody>
        </table></div></div>
      </div>`;
    },

    /* Workflow 5 from the brief: one cheque against several invoices. The
       money is applied oldest first, which is what you would do by hand, and
       any remainder is shown rather than silently absorbed. */
    receive(custId) {
      const openCount = c => INVOICES.filter(i => i.cust === c.id && i.bal > 0).length;
      const withOpen = CUSTOMERS.filter(c => openCount(c) > 0)
                                .sort((a, b) => openCount(b) - openCount(a));
      const c = cust(custId) || withOpen[0] || CUSTOMERS[0];
      const open = INVOICES.filter(i => i.cust === c.id && i.bal > 0).sort((a, b) => b.age - a.age);
      const due = open.reduce((a, i) => a + i.bal, 0);
      const entered = state.receive == null ? due : state.receive;

      let left = entered;
      const applied = open.map(i => {
        const take = Math.min(left, i.bal);
        left -= take;
        return { i, take };
      });
      const unapplied = left;

      return head("Receive payment", `${esc(c.short)} · ${open.length} open invoices`,
        `<button class="btn" data-go="customers">← Customers</button>
         <button class="btn btn-primary" data-record="${c.id}" ${entered <= 0 ? "disabled" : ""}>Record ${plain(entered)}</button>`) + `
      <div class="pad">
        <div class="strip">
          <div class="strip-cell"><div class="lbl">Open balance</div><div class="strip-val">${money(due)}</div><div class="strip-note">${esc(c.terms)}</div></div>
          <div class="strip-cell"><div class="lbl">Applying</div><div class="strip-val">${money(entered - unapplied)}</div><div class="strip-note">across ${applied.filter(a => a.take > 0).length} invoices</div></div>
          <div class="strip-cell"><div class="lbl">Unapplied</div><div class="strip-val ${unapplied ? "warn" : ""}">${money(unapplied)}</div><div class="strip-note">${unapplied ? "would sit as a credit" : "fully applied"}</div></div>
          <div class="strip-cell"><div class="lbl">Left owing</div><div class="strip-val ${due - (entered - unapplied) ? "warn" : "pos"}">${money(Math.max(0, due - (entered - unapplied)))}</div><div class="strip-note">after this payment</div></div>
        </div>

        <div class="line-add" style="border:1px solid var(--line);border-radius:7px;margin-bottom:14px">
          <span class="lbl" style="flex:none">Customer</span>
          <select id="payCust" style="height:calc(26px * var(--fs));border:1px solid var(--line);border-radius:5px;background:var(--surface);padding:0 8px">
            ${withOpen.map(x => `<option value="${x.id}" ${x.id === c.id ? "selected" : ""}>${esc(x.short)}</option>`).join("")}
          </select>
          <span class="lbl" style="flex:none">Amount</span>
          <input id="payAmt" inputmode="decimal" value="${(entered / 100).toFixed(2)}" style="max-width:140px">
          <button class="btn" data-fill="${due}">Full balance</button>
          <span class="dim" style="font-size:calc(11px * var(--fs))">applied oldest first</span>
        </div>

        <div class="grid-wrap"><div class="grid-scroll"><table>
          <thead><tr><th>Invoice</th><th>Date</th><th class="r">Age</th><th>Customer PO</th><th class="r">Balance</th><th class="r">Applying</th><th class="r">Left</th></tr></thead>
          <tbody>${applied.map(({ i, take }) => `
            <tr data-clickable data-inv="${i.no}" style="${take ? "" : "opacity:.55"}">
              <td class="mono">${i.no}</td>
              <td class="mono dim">${i.date}</td>
              <td class="r num ${i.age > 30 ? "" : "dim"}" style="${i.age > 60 ? "color:var(--crit)" : i.age > 30 ? "color:var(--warn)" : ""}">${i.age}d</td>
              <td class="mono dim">${i.custPO ? esc(i.custPO) : "—"}</td>
              <td class="r num">${plain(i.bal)}</td>
              <td class="r num" style="color:${take ? "var(--ok)" : "var(--ink-dim)"}">${take ? plain(take) : "—"}</td>
              <td class="r num">${i.bal - take ? plain(i.bal - take) : '<span class="dim">paid</span>'}</td>
            </tr>`).join("")}</tbody>
        </table></div></div>
        <p class="hint">Oldest invoices are cleared first. Anything left over is held as an unapplied credit rather than being spread around, because guessing which invoice a customer meant to pay is how disputes start.</p>
      </div>`;
    },

    orders(filter) {
      const active = filter || "all";
      const shown = active === "all" ? ORDERS : ORDERS.filter(o => o.stage === active);
      const count = id => ORDERS.filter(o => o.stage === id).length;
      const value = id => ORDERS.filter(o => o.stage === id).reduce((a, o) => a + o.total, 0);
      const late = o => o.stage !== "shipped" && o.promised < "2026-08-20";

      return head("Orders", "Committed work, by where it physically is",
        `<button class="btn btn-primary">New order</button>`) + `
      <div class="pad">
        <div class="chips">
          <button class="chip" aria-pressed="${active === "all"}" data-stage="all">
            <span class="n">${ORDERS.length}</span><span class="cap">All</span></button>
          ${STAGES.map(st => `
            <button class="chip" aria-pressed="${active === st.id}" data-stage="${st.id}">
              <span class="dot" style="background:${st.color}"></span>
              <span class="n">${count(st.id)}</span>
              <span class="cap">${st.label} · ${plain(value(st.id))}</span>
            </button>`).join("")}
        </div>

        <div class="grid-wrap"><div class="grid-scroll"><table>
          <thead><tr>
            <th>Order</th><th>Promised</th><th>Customer</th><th>From</th>
            <th>What</th><th>Material</th><th class="r">Sq ft</th>
            <th class="r">Value</th><th>Money</th><th>Stage</th>
          </tr></thead>
          <tbody>${shown.map(o => `
            <tr data-clickable data-order="${o.no}">
              <td class="mono">${o.no}</td>
              <td class="mono ${late(o) ? "" : "dim"}" style="${late(o) ? "color:var(--crit)" : ""}">${o.promised}${late(o) ? " ⚑" : ""}</td>
              <td class="trunc">${esc(cust(o.cust).short)}</td>
              <td class="dim"><span aria-hidden="true">${SOURCES[o.source].glyph}</span> ${SOURCES[o.source].label}${o.ref ? ` <span class="mono">${esc(o.ref)}</span>` : ""}</td>
              <td class="trunc dim">${(o.lines || []).map(l => `${l.qty} × ${l.sku}`).join(", ")}</td>
              <td><span class="swatch" style="background:${cls(o.cls).color}"></span>${esc(o.material)}</td>
              <td class="r num dim">${o.sqft || "—"}</td>
              <td class="r num">${plain(o.total)}</td>
              <td>${orderPaidState(o) === "paid" ? '<span class="tag ok">paid</span>'
                   : orderPaidState(o) === "part" ? '<span class="tag warn">part</span>'
                   : `<span class="tag">${esc(cust(o.cust).terms)}</span>`}</td>
              <td><span class="tag" style="color:${orderStage(o).color};border-color:${orderStage(o).color}66">${orderStage(o).label.toLowerCase()}</span></td>
            </tr>`).join("")}</tbody>
        </table></div></div>
        <p class="hint">Stage is where the job physically is. Money is a separate column because a
        Shopify order arrives paid and a wholesale order arrives on terms — the same record, two
        different states. A red promised date has already passed.</p>
      </div>`;
    },

    order(no) {
      const o = ORDERS.find(x => x.no === no) || ORDERS[0];
      const c = cust(o.cust);
      const here = stageIndex(o.stage);
      const files = attachmentsFor(o.no);
      const nextStage = here < STAGES.length - 1 ? STAGES[here + 1] : null;

      return head(o.no, `${esc(c.short)} · promised ${o.promised}`,
        `<button class="btn" data-go="orders">← Back</button>
         ${nextStage ? `<button class="btn btn-primary" data-advance="${o.no}">Mark ${nextStage.label.toLowerCase()}</button>` : ""}
         ${o.stage === "shipped" && !o.invoice ? `<button class="btn btn-primary" data-billorder="${o.no}">Invoice it</button>` : ""}
         ${o.invoice ? `<button class="btn" data-inv="${o.invoice}">Invoice ${o.invoice} →</button>` : ""}`) + `
      <div class="stepper">
        ${STAGES.map((st, n) => `
          <div class="step ${n < here ? "done" : n === here ? "here" : ""}">
            <span class="s-lbl">${st.label}</span>
            <span class="s-val">${n < here ? "done" : n === here ? "current" : "pending"}</span>
          </div>`).join("")}
      </div>
      <div class="pad">
        <div class="split">
          <div class="panel">
            <div class="doc-head">
              <div class="field"><span class="lbl">Customer</span><span class="field-val">${esc(c.short)}</span></div>
              <div class="field"><span class="lbl">Came from</span><span class="field-val">${SOURCES[o.source].label}${o.ref ? ` · <span class="mono">${esc(o.ref)}</span>` : ""}</span></div>
              <div class="field"><span class="lbl">Customer PO</span><span class="field-val mono">${o.custPO ? esc(o.custPO) : "—"}</span></div>
              <div class="field"><span class="lbl">Promised</span><span class="field-val mono" style="${o.promised < "2026-08-20" && o.stage !== "shipped" ? "color:var(--crit)" : ""}">${o.promised}</span></div>
              <div class="field"><span class="lbl">Material</span><span class="field-val"><span class="swatch" style="background:${cls(o.cls).color}"></span>${esc(o.material)}${o.sqft ? ` · ${o.sqft} sq ft` : ""}</span></div>
              <div class="field"><span class="lbl">Money</span><span class="field-val">${plain(o.total)} · ${orderPaidState(o) === "paid" ? "paid at source" : orderPaidState(o) === "part" ? "part paid" : esc(c.terms)}</span></div>
            </div>
            ${o.note ? `<div class="offline-bar" style="background:var(--surface-2);border-color:var(--line);color:var(--ink-2)">
              <span class="lbl" style="flex:none">Shop note</span> ${esc(o.note)}</div>` : ""}
            <div class="grid-scroll"><table>
              <thead><tr><th style="width:34px">#</th><th>Item</th><th>Description</th><th class="r">Qty</th><th class="r">Rate</th><th class="r">Amount</th></tr></thead>
              <tbody>${(o.lines || []).map((l, n) => {
                const it = item(l.sku);
                return `<tr><td class="mono dim">${n + 1}</td><td class="mono">${esc(l.sku)}</td>
                  <td class="trunc dim">${esc(it ? it.desc : "")}</td>
                  <td class="r num">${l.qty}</td><td class="r num">${plain(l.rate)}</td>
                  <td class="r num">${plain(l.qty * l.rate)}</td></tr>`; }).join("")}</tbody>
            </table></div>
            <div class="totals"><dl>
              <div class="grand" style="display:contents"><dt>Order value</dt><dd>${plain(o.total)}</dd></div>
            </dl></div>
          </div>
          <div>
            <div class="panel" style="margin-bottom:14px">
              <div class="panel-head"><span class="lbl">Files</span>
                <span class="spacer" style="flex:1"></span>
                <span class="lbl">${files.length}</span></div>
              <div class="panel-body" style="padding:2px 12px 10px">
                ${files.length ? files.map(f => `
                  <div class="link-row" style="cursor:default">
                    <span class="link-glyph" aria-hidden="true">${f.kind === "artwork" ? "✎" : f.kind === "proof" ? "◱" : "▣"}</span>
                    <span class="link-main"><b>${esc(f.name)}</b>
                      <div class="link-sub">${esc(f.kind)} · ${f.size} · ${f.date}</div></span>
                  </div>`).join("")
                : '<p class="hint" style="margin:8px 0">No files. Artwork and proofs belong here.</p>'}
                ${o.stage === "tocut" && !files.some(f => f.kind === "proof")
                  ? `<div class="fail-bar warn" style="margin:8px -12px -10px;border-top:1px solid var(--line)">
                       <span class="tag warn">hold</span>
                       <span style="font-size:calc(12px * var(--fs))">No approved proof on file — do not cut.</span>
                     </div>` : ""}
              </div>
            </div>
            <div class="panel">
              <div class="panel-head"><span class="lbl">${esc(c.short)}</span></div>
              <div class="panel-body">
                <dl class="kv">
                  <dt>Location</dt><dd>${esc(c.city)}</dd>
                  <dt>Terms</dt><dd>${esc(c.terms)}</dd>
                  <dt>Open balance</dt><dd class="num">${plain(c.bal)}</dd>
                </dl>
                <button class="btn" style="margin-top:10px;width:100%" data-cust="${c.id}">Full history</button>
              </div>
            </div>
          </div>
        </div>
      </div>`;
    },

    payables() {
      /* "What do I owe and when", not an aging table you have to interpret. */
      const rows = BILLS.filter(b => billBalance(b) > 0).map(b => {
        const credit = VENDORCREDITS.filter(v => v.vendor === b.vendor)
                                    .reduce((a, v) => a + vcRemaining(v), 0);
        const days = Math.round((new Date(b.due) - new Date("2026-08-20")) / 86400000);
        return { b, credit, days, net: Math.max(0, billBalance(b) - credit) };
      }).sort((a, b) => a.days - b.days);

      const within = n => rows.filter(r => r.days <= n).reduce((a, r) => a + r.net, 0);
      const totalCredit = VENDORCREDITS.reduce((a, v) => a + vcRemaining(v), 0);

      return head("Money out", "What you owe, when it is due, and what you already hold against it") + `
      <div class="pad">
        <div class="strip">
          <div class="strip-cell"><div class="lbl">Overdue</div><div class="strip-val ${within(-1) ? "neg" : ""}">${money(rows.filter(r => r.days < 0).reduce((a, r) => a + r.net, 0))}</div><div class="strip-note">past the due date</div></div>
          <div class="strip-cell"><div class="lbl">This week</div><div class="strip-val warn">${money(within(7) - rows.filter(r => r.days < 0).reduce((a, r) => a + r.net, 0))}</div><div class="strip-note">next 7 days</div></div>
          <div class="strip-cell"><div class="lbl">This month</div><div class="strip-val">${money(within(31))}</div><div class="strip-note">next 31 days</div></div>
          <div class="strip-cell"><div class="lbl">Credit in hand</div><div class="strip-val pos">${money(totalCredit)}</div><div class="strip-note">apply before paying</div></div>
          <div class="strip-cell"><div class="lbl">Net to pay</div><div class="strip-val">${money(rows.reduce((a, r) => a + r.net, 0))}</div><div class="strip-note">after credits</div></div>
        </div>
        <div class="grid-wrap"><div class="grid-scroll"><table>
          <thead><tr><th>Due</th><th class="r">In</th><th>Vendor</th><th>Bill</th><th class="r">Balance</th><th class="r">Credit held</th><th class="r">Net to pay</th><th></th></tr></thead>
          <tbody>${rows.length ? rows.map(r => `
            <tr data-clickable data-bill="${r.b.no}">
              <td class="mono ${r.days < 0 ? "" : "dim"}" style="${r.days < 0 ? "color:var(--crit)" : ""}">${r.b.due}</td>
              <td class="r num" style="color:${r.days < 0 ? "var(--crit)" : r.days <= 7 ? "var(--warn)" : "var(--ink-dim)"}">${r.days < 0 ? `${-r.days}d late` : `${r.days}d`}</td>
              <td>${esc(r.b.vendor)}</td>
              <td class="mono dim">${r.b.no}</td>
              <td class="r num">${plain(billBalance(r.b))}</td>
              <td class="r num" style="color:${r.credit ? "var(--ok)" : "var(--ink-dim)"}">${r.credit ? "−" + plain(r.credit) : "—"}</td>
              <td class="r num" style="font-weight:500">${plain(r.net)}</td>
              <td>${r.credit ? '<span class="tag ok">credit available</span>' : ""}</td>
            </tr>`).join("") : '<tr><td colspan="8" class="dim">Nothing outstanding.</td></tr>'}</tbody>
        </table></div></div>
        <p class="hint">Net to pay already deducts credit you are holding from that vendor. Paying the
        balance without applying the credit first is how a credit expires unused.</p>
      </div>`;
    },

    custcredits() {
      const unapplied = CUSTOMERCREDITS.reduce((a, c) => a + ccRemaining(c), 0);
      return head("Customer credits", `${CUSTOMERCREDITS.length} issued · ${money(unapplied)} not yet applied`) + `
      <div class="pad">
        <div class="grid-wrap"><div class="grid-scroll"><table>
          <thead><tr><th>No.</th><th>Date</th><th>Customer</th><th>Reason</th><th class="r">Amount</th><th class="r">Applied</th><th class="r">Available</th><th>Against</th></tr></thead>
          <tbody>${CUSTOMERCREDITS.map(c => `
            <tr data-clickable ${c.applied.length ? `data-inv="${c.applied[0].inv}"` : `data-cust="${c.cust}"`}>
              <td class="mono">${c.no}</td>
              <td class="mono dim">${c.date}</td>
              <td class="trunc">${esc(cust(c.cust).short)}</td>
              <td class="trunc dim">${esc(c.reason)}</td>
              <td class="r num">${plain(c.total)}</td>
              <td class="r num dim">${ccApplied(c) ? plain(ccApplied(c)) : "—"}</td>
              <td class="r num" style="color:${ccRemaining(c) ? "var(--warn)" : "var(--ink-dim)"}">${ccRemaining(c) ? plain(ccRemaining(c)) : "—"}</td>
              <td>${c.applied.length ? c.applied.map(a => `<span class="tag acc">inv ${a.inv}</span>`).join(" ") : '<span class="tag warn">unapplied</span>'}</td>
            </tr>`).join("")}</tbody>
        </table></div></div>
        <p class="hint">An unapplied customer credit is money you owe back. It shows on their statement
        whether or not you have applied it, so leaving it here does not hide it.</p>
      </div>`;
    },

    expenses() {
      const total = EXPENSES.reduce((a, e) => a + e.amount, 0);
      const byMethod = [...new Set(EXPENSES.map(e => e.method))].map(m => ({
        m, total: EXPENSES.filter(e => e.method === m).reduce((a, e) => a + e.amount, 0)
      }));
      return head("Expenses", "Spend that does not deserve a purchase order",
        `<button class="btn btn-primary">Record expense</button>`) + `
      <div class="pad">
        <div class="strip">
          <div class="strip-cell"><div class="lbl">This month</div><div class="strip-val">${money(total)}</div><div class="strip-note">${EXPENSES.length} entries</div></div>
          ${byMethod.map(x => `<div class="strip-cell"><div class="lbl">${esc(x.m)}</div><div class="strip-val" style="font-size:calc(17px * var(--fs))">${money(x.total)}</div><div class="strip-note">${EXPENSES.filter(e => e.method === x.m).length} entries</div></div>`).join("")}
        </div>
        <div class="grid-wrap"><div class="grid-scroll"><table>
          <thead><tr><th>No.</th><th>Date</th><th>Paid to</th><th>Account</th><th>Class</th><th>Paid by</th><th class="r">Amount</th></tr></thead>
          <tbody>${EXPENSES.map(e => `
            <tr data-clickable>
              <td class="mono">${e.no}</td>
              <td class="mono dim">${e.date}</td>
              <td>${esc(e.payee)}</td>
              <td class="dim">${esc(e.account)}</td>
              <td>${e.cls ? `<span class="swatch" style="background:${cls(e.cls).color}"></span><span class="dim">${cls(e.cls).name}</span>` : '<span class="dim">unallocated</span>'}</td>
              <td class="dim">${esc(e.method)}</td>
              <td class="r num">${plain(e.amount)}</td>
            </tr>`).join("")}</tbody>
        </table></div></div>
        <p class="hint">Class is optional here on purpose — fuel and licence fees are not a product
        line, and forcing a class onto them only makes the margin report lie.</p>
      </div>`;
    },

    recipes() {
      const rows = RECIPES.map(r => ({ r, c: recipeCost(r) }));
      return head("Build sheets", "What each product is made of, and what that actually costs") + `
      <div class="pad">
        <div class="strip">
          <div class="strip-cell"><div class="lbl">Products costed</div><div class="strip-val">${RECIPES.length}</div><div class="strip-note">from sheet to finished good</div></div>
          <div class="strip-cell"><div class="lbl">Blended margin</div><div class="strip-val pos">${Math.round(rows.reduce((a, x) => a + x.c.margin, 0) / rows.length * 100)}%</div><div class="strip-note">unweighted across products</div></div>
          <div class="strip-cell"><div class="lbl">Cost lost to waste</div><div class="strip-val warn">${money(rows.reduce((a, x) => a + x.c.scrapCost, 0))}</div><div class="strip-note">per one of each, at current yields</div></div>
          <div class="strip-cell"><div class="lbl">Shop rate</div><div class="strip-val">${money(SHOP_RATE_PER_HOUR)}</div><div class="strip-note">per hour, blended</div></div>
        </div>
        <div class="grid-wrap"><div class="grid-scroll"><table>
          <thead><tr><th>SKU</th><th>Product</th><th class="r">Yield</th><th class="r">Material</th><th class="r">Waste</th><th class="r">Parts</th><th class="r">Labour</th><th class="r">Unit cost</th><th class="r">Price</th><th class="r">Margin</th></tr></thead>
          <tbody>${rows.map(({ r, c }) => `
            <tr data-clickable data-recipe="${esc(r.sku)}">
              <td class="mono">${esc(r.sku)}</td>
              <td class="trunc dim">${esc((item(r.sku) || {}).desc || "")}</td>
              <td class="r num" style="color:${r.yield < .8 ? "var(--crit)" : r.yield < .9 ? "var(--warn)" : "var(--ok)"}">${Math.round(r.yield * 100)}%</td>
              <td class="r num">${plain(c.materialCost)}</td>
              <td class="r num" style="color:var(--warn)">${plain(c.scrapCost)}</td>
              <td class="r num dim">${plain(c.partsCost)}</td>
              <td class="r num dim">${plain(c.laborCost)}</td>
              <td class="r num" style="font-weight:500">${plain(c.total)}</td>
              <td class="r num dim">${plain(c.price)}</td>
              <td class="r num" style="color:${c.margin > .5 ? "var(--ok)" : c.margin > .3 ? "var(--ink)" : "var(--crit)"}">${Math.round(c.margin * 100)}%</td>
            </tr>`).join("")}</tbody>
        </table></div></div>
        <p class="hint">Waste is a column, not a footnote. At 78% nesting yield a rescue tube throws
        away nearly a third of the foam it is charged for, and that is the single biggest lever on
        its margin — bigger than the towline, the harness and the labour combined.</p>
      </div>`;
    },

    recipe(sku) {
      const r = recipe(sku) || RECIPES[0];
      const c = recipeCost(r);
      const it = item(r.sku);
      const builds = BUILDS.filter(b => b.sku === r.sku);

      /* What happens to margin if foam moves. The question Dan asks every
         time Continental Foam sends a price letter. */
      const sensitivity = [-10, 0, 10, 20].map(pct => {
        const mat = r.components.reduce((a, x) => {
          const m = material(x.material);
          return a + (m ? (x.bf / r.yield) * landedPerBf(m) * (1 + pct / 100) : 0);
        }, 0);
        const total = mat + c.partsCost + c.laborCost;
        return { pct, total: Math.round(total), margin: c.price ? (c.price - total) / c.price : 0 };
      });

      /* And what a better nest would be worth. */
      const yieldGain = [0, 5, 10].map(pts => {
        const y = Math.min(0.99, r.yield + pts / 100);
        const mat = r.components.reduce((a, x) => {
          const m = material(x.material);
          return a + (m ? (x.bf / y) * landedPerBf(m) : 0);
        }, 0);
        const total = mat + c.partsCost + c.laborCost;
        return { y, total: Math.round(total), saved: c.total - Math.round(total) };
      });

      return head(r.sku, esc((it || {}).desc || ""),
        `<button class="btn" data-go="recipes">← Back</button>
         <button class="btn" data-item="${esc(r.sku)}">Item page</button>`) + `
      <div class="pad">
        <div class="strip">
          <div class="strip-cell"><div class="lbl">Unit cost</div><div class="strip-val">${money(c.total)}</div><div class="strip-note">computed, not entered</div></div>
          <div class="strip-cell"><div class="lbl">Sell price</div><div class="strip-val">${money(c.price)}</div><div class="strip-note">current list</div></div>
          <div class="strip-cell"><div class="lbl">Gross margin</div><div class="strip-val ${c.margin > .5 ? "pos" : c.margin > .3 ? "" : "neg"}">${Math.round(c.margin * 100)}%</div><div class="strip-note">${money(c.price - c.total)} per unit</div></div>
          <div class="strip-cell"><div class="lbl">Nesting yield</div><div class="strip-val ${r.yield < .8 ? "neg" : "warn"}">${Math.round(r.yield * 100)}%</div><div class="strip-note">${money(c.scrapCost)} of waste per unit</div></div>
        </div>

        <div class="split">
          <div>
            <div class="panel" style="margin-bottom:14px">
              <div class="panel-head"><span class="lbl">What goes into one</span>
                <span class="spacer" style="flex:1"></span>
                <span class="dim" style="font-size:calc(11px * var(--fs))">${esc(r.note)}</span></div>
              <div class="grid-scroll"><table>
                <thead><tr><th>Component</th><th>Source</th><th class="r">Needed</th><th class="r">Bought</th><th class="r">Rate</th><th class="r">Cost</th></tr></thead>
                <tbody>
                  ${r.components.map(x => {
                    const m = material(x.material);
                    if (!m) return "";
                    const bought = x.bf / r.yield;
                    return `<tr>
                      <td class="mono">${esc(m.sku)}</td>
                      <td class="trunc dim">${esc(m.vendor)}</td>
                      <td class="r num">${x.bf.toFixed(1)} bf</td>
                      <td class="r num" style="color:var(--warn)">${bought.toFixed(2)} bf</td>
                      <td class="r num dim">${plain(Math.round(landedPerBf(m)))}/bf</td>
                      <td class="r num">${plain(Math.round(bought * landedPerBf(m)))}</td>
                    </tr>`; }).join("")}
                  ${r.parts.map(x => `<tr>
                      <td>${esc(x.name)}</td><td class="dim">bought part</td>
                      <td class="r num dim">1</td><td class="r num dim">1</td>
                      <td class="r num dim">${plain(x.cost)}</td>
                      <td class="r num">${plain(x.cost)}</td>
                    </tr>`).join("")}
                  <tr>
                    <td>Shop labour</td><td class="dim">${r.laborMin} min at ${plain(SHOP_RATE_PER_HOUR)}/hr</td>
                    <td class="r num dim">—</td><td class="r num dim">—</td><td class="r num dim">—</td>
                    <td class="r num">${plain(c.laborCost)}</td>
                  </tr>
                  <tr style="border-top:1px solid var(--line)">
                    <td style="font-weight:600">Unit cost</td><td></td><td></td><td></td><td></td>
                    <td class="r num" style="font-weight:600">${plain(c.total)}</td>
                  </tr>
                </tbody>
              </table></div>
              <div class="panel-body" style="border-top:1px solid var(--line)">
                <p class="hint" style="margin:0">“Needed” is what ends up in the product. “Bought” is
                what you must buy to get it at ${Math.round(r.yield * 100)}% nesting yield — the gap
                is offcut, and you paid full price for it.</p>
              </div>
            </div>

            ${builds.length ? `<div class="panel">
              <div class="panel-head"><span class="lbl">Builds of this product</span></div>
              <div class="grid-scroll"><table>
                <thead><tr><th>No.</th><th>Date</th><th class="r">Qty</th><th class="r">Expected</th><th class="r">Actual</th><th class="r">Variance</th><th>Operator</th></tr></thead>
                <tbody>${builds.map(b => { const v = buildVariance(b); return `
                  <tr data-clickable data-go="builds">
                    <td class="mono">${b.no}</td><td class="mono dim">${b.date}</td>
                    <td class="r num">${b.qty}</td>
                    <td class="r num dim">${b.bfExpected.toFixed(1)}</td>
                    <td class="r num">${b.bfActual.toFixed(1)}</td>
                    <td class="r num" style="color:${v.bf > 0 ? "var(--crit)" : "var(--ok)"}">${v.bf > 0 ? "+" : ""}${v.bf.toFixed(1)} bf · ${plain(v.cost)}</td>
                    <td class="dim">${esc(b.operator)}</td>
                  </tr>`; }).join("")}</tbody>
              </table></div>
            </div>` : ""}
          </div>

          <div>
            <div class="panel" style="margin-bottom:14px">
              <div class="panel-head"><span class="lbl">If foam moves</span></div>
              <div class="grid-scroll"><table>
                <thead><tr><th>Change</th><th class="r">Unit cost</th><th class="r">Margin</th></tr></thead>
                <tbody>${sensitivity.map(x => `
                  <tr style="${x.pct === 0 ? "background:var(--accent-soft)" : ""}">
                    <td class="num">${x.pct > 0 ? "+" : ""}${x.pct}%</td>
                    <td class="r num">${plain(x.total)}</td>
                    <td class="r num" style="color:${x.margin > .5 ? "var(--ok)" : x.margin > .3 ? "var(--ink)" : "var(--crit)"}">${Math.round(x.margin * 100)}%</td>
                  </tr>`).join("")}</tbody>
              </table></div>
            </div>

            <div class="panel">
              <div class="panel-head"><span class="lbl">If the nest improves</span></div>
              <div class="grid-scroll"><table>
                <thead><tr><th>Yield</th><th class="r">Unit cost</th><th class="r">Saved</th></tr></thead>
                <tbody>${yieldGain.map(x => `
                  <tr style="${x.saved === 0 ? "background:var(--accent-soft)" : ""}">
                    <td class="num">${Math.round(x.y * 100)}%</td>
                    <td class="r num">${plain(x.total)}</td>
                    <td class="r num" style="color:${x.saved ? "var(--ok)" : "var(--ink-dim)"}">${x.saved ? plain(x.saved) : "—"}</td>
                  </tr>`).join("")}</tbody>
              </table></div>
              <div class="panel-body" style="border-top:1px solid var(--line)">
                <p class="hint" style="margin:0">Five points of yield on this part is worth more than
                a five percent foam discount. Worth knowing which call to make.</p>
              </div>
            </div>
          </div>
        </div>
      </div>`;
    },

    builds() {
      const rows = BUILDS.map(b => ({ b, v: buildVariance(b) }));
      const overrun = rows.reduce((a, x) => a + Math.max(0, x.v.cost), 0);
      return head("Builds", "What was actually cut, against what the build sheet said",
        `<button class="btn btn-primary">Record build</button>`) + `
      <div class="pad">
        <div class="strip">
          <div class="strip-cell"><div class="lbl">Builds</div><div class="strip-val">${BUILDS.length}</div><div class="strip-note">this month</div></div>
          <div class="strip-cell"><div class="lbl">Foam consumed</div><div class="strip-val">${BUILDS.reduce((a, b) => a + b.bfActual, 0).toFixed(0)}<span style="font-size:calc(14px * var(--fs));color:var(--ink-3)"> bf</span></div><div class="strip-note">${BUILDS.reduce((a, b) => a + b.sheets, 0)} sheets</div></div>
          <div class="strip-cell"><div class="lbl">Overrun</div><div class="strip-val ${overrun ? "neg" : "pos"}">${money(overrun)}</div><div class="strip-note">above the build sheet</div></div>
          <div class="strip-cell"><div class="lbl">Worst variance</div><div class="strip-val warn">${Math.round(Math.max(...rows.map(x => x.v.pct)) * 100)}%</div><div class="strip-note">${esc(rows.reduce((a, x) => x.v.pct > a.v.pct ? x : a).b.sku)}</div></div>
        </div>
        <div class="grid-wrap"><div class="grid-scroll"><table>
          <thead><tr><th>No.</th><th>Date</th><th>Product</th><th class="r">Qty</th><th>For</th><th class="r">Sheets</th><th class="r">Expected</th><th class="r">Actual</th><th class="r">Variance</th><th class="r">Cost of variance</th><th>By</th></tr></thead>
          <tbody>${rows.map(({ b, v }) => `
            <tr data-clickable data-recipe="${esc(b.sku)}">
              <td class="mono">${b.no}</td>
              <td class="mono dim">${b.date}</td>
              <td class="mono">${esc(b.sku)}</td>
              <td class="r num">${b.qty}</td>
              <td>${b.order ? `<span class="tag acc">${b.order}</span>` : '<span class="dim">to stock</span>'}</td>
              <td class="r num dim">${b.sheets}</td>
              <td class="r num dim">${b.bfExpected.toFixed(1)}</td>
              <td class="r num">${b.bfActual.toFixed(1)}</td>

        <p class="hint">A build that runs over is either a bad nest or a wrong build sheet, and those

    costing() {
      return head("Landed cost", "What a sheet really costs once freight is on it") + `
      <div class="pad">
        <div class="grid-wrap" style="margin-bottom:14px"><div class="grid-scroll"><table>
          <thead><tr><th>Material</th><th>Vendor</th><th class="r">Sheet</th><th class="r">Freight</th><th class="r">Landed</th><th class="r">Board-feet</th><th class="r">Per bf</th><th>Feeds</th></tr></thead>
          <tbody>${MATERIALS.map(m => {
            const uses = RECIPES.filter(r => r.components.some(c => c.material === m.sku));
            return `<tr>
              <td class="mono">${esc(m.sku)}</td>
              <td class="dim">${esc(m.vendor)}</td>
              <td class="r num dim">${plain(m.basePerSheet)}</td>
              <td class="r num dim">${plain(m.freightPerSheet)}</td>
              <td class="r num">${plain(landedPerSheet(m))}</td>
              <td class="r num dim">${m.bfPerSheet}</td>
              <td class="r num" style="font-weight:500">${plain(Math.round(landedPerBf(m)))}</td>
              <td>${uses.length ? uses.map(u => `<span class="tag acc">${esc(u.sku)}</span>`).join(" ") : '<span class="dim">nothing yet</span>'}</td>

        </table></div></div>
        <div class="callout" style="border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:7px;background:var(--surface);padding:12px 15px">
          <p style="margin:0;font-size:calc(13px * var(--fs))"><strong>Freight is allocated by board-foot, not by line count.</strong>
          A pallet carrying twelve blue sheets and six red ones does not split its freight in half —

    ledger() {
      const entries = journal();
      const unbalanced = entries.filter(e => !e.balanced);
      return head("Ledger", `${entries.length} entries · every one generated from a document`,
        `<button class="btn" data-go="postingrules">Posting rules</button>
         <button class="btn" data-go="trial">Trial balance</button>`) + `
      <div class="pad">
        <div class="strip">
          <div class="strip-cell"><div class="lbl">Entries</div><div class="strip-val">${entries.length}</div><div class="strip-note">from documents, none hand-posted</div></div>

          <div class="strip-cell"><div class="lbl">Total credits</div><div class="strip-val">${money(entries.reduce((a, e) => a + e.cr, 0))}</div><div class="strip-note">must equal debits</div></div>
          <div class="strip-cell"><div class="lbl">Out of balance</div><div class="strip-val ${unbalanced.length ? "neg" : "pos"}">${unbalanced.length}</div><div class="strip-note">${unbalanced.length ? "investigate immediately" : "as it must be"}</div></div>
        </div>
        <div class="grid-wrap"><div class="grid-scroll"><table>
          <thead><tr><th>Date</th><th>Source</th><th>Memo</th><th>Account</th><th class="r">Debit</th><th class="r">Credit</th></tr></thead>
          <tbody>${entries.slice(0, 26).flatMap(e => e.lines.map((l, n) => `
            <tr style="${n === 0 ? "border-top:1px solid var(--line)" : ""}">

              <td class="trunc dim">${n === 0 ? esc(e.memo) : ""}</td>

              <td class="r num">${l.dr ? plain(l.dr) : '<span class="dim">—</span>'}</td>
              <td class="r num">${l.cr ? plain(l.cr) : '<span class="dim">—</span>'}</td>
            </tr>`)).join("")}</tbody>
        </table></div></div>
        <p class="hint">Showing the most recent 26 entries. There is no “new journal entry” button on

      </div>`;
    },

    trial() {
      const tb = trialBalance();
      const balanced = tb.dr === tb.cr;
      return head("Trial balance", "As of 20 August 2026 · accrual basis",
        `<button class="btn" data-go="ledger">← Ledger</button>`) + `
      <div class="pad">
        <div class="strip">
          <div class="strip-cell"><div class="lbl">Total debits</div><div class="strip-val">${money(tb.dr)}</div><div class="strip-note">${tb.rows.length} accounts with activity</div></div>
