<title>BunzBooks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;450;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">

<div class="app">

  <header class="chrome">
    <div class="mark">
      <svg class="mark-glyph" viewBox="0 0 26 24" aria-hidden="true" focusable="false">
        <path d="M2.4 11.6C2.4 5.9 7.1 2.2 13 2.2s10.6 3.7 10.6 9.4a1.5 1.5 0 0 1-1.5 1.5H3.9a1.5 1.5 0 0 1-1.5-1.5Z" fill="var(--bun-top)"/>
        <ellipse cx="8.2"  cy="8.1" rx="1.35" ry=".78" fill="var(--bun-seed)" transform="rotate(-22 8.2 8.1)"/>
        <ellipse cx="13"   cy="6.1" rx="1.35" ry=".78" fill="var(--bun-seed)" transform="rotate(6 13 6.1)"/>
        <ellipse cx="17.8" cy="8.1" rx="1.35" ry=".78" fill="var(--bun-seed)" transform="rotate(22 17.8 8.1)"/>
        <rect x="1.7" y="13.6" width="22.6" height="3.5" rx="1.75" fill="var(--bun-fill)"/>
        <path d="M3.2 18.2h19.6a1.3 1.3 0 0 1 1.3 1.3c0 1.4-1.1 2.4-2.5 2.4H4.4c-1.4 0-2.5-1-2.5-2.4a1.3 1.3 0 0 1 1.3-1.3Z" fill="var(--bun-heel)"/>
      </svg>
      <div class="mark-name">Bunz<span>Books</span></div>
    </div>

    <button class="co" id="coBtn" title="Switch company" aria-haspopup="true" aria-expanded="false">
      <span class="co-dot" id="coDot"></span>
      <span class="co-name" id="coName">—</span>
      <span class="co-realm" id="coRealm">—</span>
      <span class="co-caret" aria-hidden="true">▾</span>
    </button>
    <div class="co-menu" id="coMenu" hidden role="menu"></div>

    <button class="omni" id="omniBtn">
      <span aria-hidden="true">⌕</span>
      <span class="omni-text">Search customers, invoices, items, POs…</span>
      <kbd>⌘K</kbd>
    </button>

    <div class="chrome-right">
      <span class="pill is-off" id="syncPill">
        <span class="dot"></span>
        <span id="syncText">—</span>
      </span>
      <button class="pill is-crit" id="failPill" title="Records that failed to parse" hidden>
        <span class="dot"></span> <span id="failCount">0</span> quarantined
      </button>

      <div class="seg" role="group" aria-label="Text size">
        <button id="fsDown" title="Smaller text">A<sup>−</sup></button>
        <button id="fsUp" title="Bigger text">A<sup>+</sup></button>
      </div>

      <div class="seg" role="group" aria-label="Appearance">
        <button id="lightBtn" title="Light mode" aria-pressed="false">☀</button>
        <button id="darkBtn" title="Dark mode" aria-pressed="false">☾</button>
      </div>
    </div>
  </header>

  <div class="body">
    <nav class="rail" id="rail"></nav>
    <main class="main" id="main" tabindex="-1"></main>
  </div>

  <footer class="statusbar">
    <span class="sb-item">Provider <b id="sbProvider">—</b></span>
    <span class="sb-item">Last read <b id="sbMs">—</b></span>
    <span class="sb-item">Text <b id="sbFs">100%</b></span>
    <span class="spacer"></span>
    <span class="sb-item" id="sbWrites">Writes disabled</span>
  </footer>
</div>

<div class="scrim" id="scrim" hidden>
  <div class="pal" role="dialog" aria-modal="true" aria-label="Command palette">
    <div class="pal-in">
      <span aria-hidden="true" style="color:var(--ink-3)">⌕</span>
      <input id="palInput" placeholder="Jump to anything — a document, PO, customer PO, SKU, amount…" autocomplete="off" spellcheck="false">
      <kbd>esc</kbd>
    </div>
    <div class="pal-list" id="palList"></div>
    <div class="pal-foot">
      <span><kbd>↑</kbd><kbd>↓</kbd> move</span>
      <span><kbd>↵</kbd> open</span>
      <span class="spacer" style="flex:1"></span>
      <span id="palTime" class="mono"></span>
    </div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script type="module" src="js/app.js"></script>
