[package]
name = "ledger"
version = "0.1.0"
edition.workspace = true
description = "Double-entry general ledger for Aquamentor and WaterLine CNC. LEDGER-DESIGN.md."

[dependencies]
ledger-core = { path = "../../crates/ledger-core" }
# Inflates the logo PNG and deflates it into the PDF (D39). Already in the
# lock file through ureq's flate2; pure Rust.
miniz_oxide = "0.9"
qbo-local = { path = "../qbo-local" }
mcp-stdio = { workspace = true }
chrono = { workspace = true }
rusqlite = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
ureq = { workspace = true }
uuid = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
proptest = { workspace = true }
rust_decimal_macros = { workspace = true }
tempfile = { workspace = true }

[lib]
name = "ledger"
path = "src/lib.rs"

[[bin]]
name = "ledger"
path = "src/main.rs"

[[bin]]
name = "ledger-mcp"
path = "src/bin/ledger-mcp.rs"
