[package]
name = "qbo-local"
version = "0.1.0"
edition.workspace = true
description = "Local SQLite replica of QuickBooks Online with an outbox write queue."

[dependencies]
ledger-core = { path = "../../crates/ledger-core" }
chrono = { workspace = true }
rusqlite = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
ureq = { version = "2.12", optional = true }

[features]
# The real HTTP transport. Off by default so `cargo test` has no way to reach
# Intuit and compiles no TLS stack.
live = ["dep:ureq"]

[dev-dependencies]
rust_decimal_macros = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }

[lib]
name = "qbo_local"
path = "src/lib.rs"

[[bin]]
name = "qbo-local"
path = "src/main.rs"
